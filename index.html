<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#f5f5f4"/>
<title>가림</title>
<link rel="manifest" href="garim.webmanifest"/>
<link rel="apple-touch-icon" href="icon-180.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="가림"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@800&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --bg:#f5f5f4;
  --surface:#ffffff;
  --border:#e7e5e4;
  --text:#1c1917;
  --muted:#a8a29e;
  --soft:#fafaf9;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{
  min-height:100%;
  font-family:'Apple SD Gothic Neo','Noto Sans KR',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
.wrap{max-width:560px;margin:0 auto;padding:44px 24px 110px}

/* ---------- 헤더 ---------- */
.header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px}
.mark{
  font-family:Hahmlet,'Apple SD Gothic Neo',serif;font-weight:800;
  font-size:34px;line-height:1;letter-spacing:-.045em;position:relative;display:inline-block;
}
.mark .bar{
  position:absolute;left:51%;right:-2px;top:10%;bottom:14%;border-radius:3px;
  background:var(--text);transform:scaleX(0);transform-origin:left center;
  animation:wipe .5s cubic-bezier(.2,.9,.2,1) .4s forwards;
}
@keyframes wipe{to{transform:scaleX(1)}}
.tagline{font-size:12px;color:var(--muted);margin-top:6px}
.ver{font-size:10px;color:var(--muted);letter-spacing:.04em;padding-top:4px}

/* ---------- 탭 ---------- */
.tabs{display:flex;margin-bottom:22px;border:1.5px solid var(--border);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.tab{flex:1;padding:10px 4px;font-family:inherit;font-size:13px;font-weight:500;color:var(--muted);background:transparent;border:none;cursor:pointer;transition:.12s}
.tab.active{background:var(--text);color:#fff}

/* ---------- 섹션 카드 ---------- */
.sec{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:12px}
.sec-title{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.02em;margin-bottom:11px}

/* ---------- 입력 ---------- */
.field{
  width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;
  background:var(--surface);font-family:inherit;font-size:14px;color:var(--text);
  outline:none;transition:border-color .15s;
}
.field::placeholder{color:var(--muted)}
.field:focus{border-color:var(--text)}
.word-grid{display:flex;gap:8px;margin-bottom:12px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  display:inline-flex;align-items:center;gap:7px;padding:7px 12px 7px 9px;
  border:1.5px solid var(--border);border-radius:999px;background:var(--surface);
  cursor:pointer;font-size:12.5px;color:var(--muted);transition:.12s;user-select:none;
}
.chip .dot{width:14px;height:14px;border:1.5px solid var(--border);border-radius:50%;flex-shrink:0;transition:.12s;position:relative}
.chip.on{border-color:var(--text);color:var(--text);font-weight:500}
.chip.on .dot{background:var(--text);border-color:var(--text)}
.chip.on .dot::after{content:'';position:absolute;left:4px;top:2.5px;width:3.5px;height:6.5px;border:solid #fff;border-width:0 1.6px 1.6px 0;transform:rotate(42deg)}
.hint{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.5}

.styles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sty{
  border:1.5px solid var(--border);border-radius:8px;background:var(--surface);cursor:pointer;
  padding:9px 4px 8px;text-align:center;font-size:11.5px;font-weight:500;color:var(--muted);transition:.12s;
}
.sty .sw{height:18px;border-radius:5px;margin:0 auto 7px;width:70%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px}
.sty.on{background:var(--text);color:#fff;border-color:var(--text)}
.sty.on .sw{border-color:rgba(255,255,255,.3)}
.sw-black{background:#1c1917}
.sw-white{background:#fff}
.sw-mosaic{background:conic-gradient(from 0deg,#d6d3d1 25%,#a8a29e 0 50%,#d6d3d1 0 75%,#a8a29e 0);background-size:7px 7px}
.emoji-wrap{display:none;margin-top:11px;padding-top:11px;border-top:1px solid var(--border)}
.emoji-wrap.show{display:block}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.emoji-opt{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:18px;border:1.5px solid transparent;border-radius:7px;cursor:pointer}
.emoji-opt.on{border-color:var(--text);background:var(--soft)}

/* ---------- 사진 목록 ---------- */
.sheet{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.cell{
  position:relative;aspect-ratio:3/4;border:1.5px solid var(--border);border-radius:9px;
  background:var(--soft);overflow:hidden;cursor:pointer;transition:.12s;
}
.cell.done{border-color:var(--text)}
.cell:active{opacity:.85}
.cell canvas{width:100%;height:100%;display:block}
.cell .num{
  position:absolute;top:6px;left:6px;background:rgba(28,25,23,.72);color:#fff;
  font-size:10px;font-weight:600;padding:1px 6px;border-radius:6px;
}
.cell .state{
  position:absolute;left:0;right:0;bottom:0;background:rgba(28,25,23,.78);color:#fff;
  font-size:10.5px;font-weight:500;padding:4px 5px;text-align:center;
}
.cell .state.busy{background:rgba(120,113,108,.9)}
.cell .x{
  position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;
  background:rgba(28,25,23,.72);color:#fff;border:none;font-size:12px;line-height:1;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.add-cell{
  aspect-ratio:3/4;border:1.5px dashed var(--border);border-radius:9px;background:transparent;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-family:inherit;font-size:12px;color:var(--muted);transition:.12s;
}
.add-cell:hover{border-color:var(--muted);color:var(--text);background:var(--soft)}
.add-cell .plus{font-size:20px;line-height:1}

.drop{
  width:100%;border:1.5px dashed var(--border);border-radius:var(--r);padding:44px 20px;
  text-align:center;cursor:pointer;background:var(--surface);font-family:inherit;color:var(--text);transition:.15s;
}
.drop:hover,.drop.over{border-color:var(--muted);background:var(--soft)}
.drop .up{font-size:22px;display:block;margin-bottom:9px;opacity:.45}
.drop .big{font-size:13px;color:var(--muted);display:block}
.drop .small{font-size:11px;color:#c4bfbb;margin-top:4px;display:block}

/* ---------- 진행 / 결과 ---------- */
.status{display:none;margin-top:12px}
.status.show{display:block}
.status-line{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:6px}
.bar-track{height:5px;border-radius:3px;background:var(--border);overflow:hidden}
.bar-fill{height:100%;background:var(--text);width:0%;border-radius:3px;transition:width .2s linear}
.report{display:none;font-size:13px;color:var(--text);margin-top:12px;line-height:1.6}
.report.show{display:block}
.report b{font-weight:700}
.report .miss{color:var(--muted);font-size:11.5px;display:block;margin-top:5px;line-height:1.5}

/* ---------- 버튼 ---------- */
.btn{
  flex:1;padding:13px 10px;border:1.5px solid var(--border);border-radius:8px;background:var(--surface);
  font-family:inherit;font-size:14px;font-weight:600;color:var(--text);cursor:pointer;transition:.12s;
}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.45;cursor:default}
.btn-primary{background:var(--text);color:#fff;border-color:var(--text)}
.btn-row{display:flex;gap:8px}

.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(245,245,244,.94);
  border-top:1px solid var(--border);
  padding:10px 24px calc(10px + env(safe-area-inset-bottom));display:none;
}
.dock.show{display:block}
.dock-in{max-width:560px;margin:0 auto;display:flex;gap:8px;align-items:center}
.dock-count{font-size:11px;color:var(--muted);white-space:nowrap;line-height:1.35}
.dock-count b{display:block;font-size:14px;color:var(--text);font-weight:600}

/* ---------- 텍스트 탭 ---------- */
.text-panel{display:none}
.text-panel.show{display:block}
.rule-row{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.arrow{color:var(--muted);flex-shrink:0;font-size:13px}
.del-rule{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:0 3px;line-height:1;flex-shrink:0}
.add-rule{width:100%;border:1.5px dashed var(--border);border-radius:8px;background:transparent;padding:9px;font-family:inherit;font-size:12px;color:var(--muted);cursor:pointer}
.add-rule:hover{border-color:var(--muted);color:var(--text)}
.ta{
  width:100%;min-height:170px;padding:12px;border:1.5px solid var(--border);border-radius:8px;
  background:var(--surface);font-family:inherit;font-size:14px;line-height:1.65;resize:vertical;outline:none;color:var(--text);
}
.ta:focus{border-color:var(--text)}

/* ---------- 모달 ---------- */
.modal{position:fixed;inset:0;background:rgba(28,25,23,.55);z-index:120;display:none;align-items:center;justify-content:center;padding:14px}
.modal.show{display:flex}
.modal-box{
  background:var(--bg);border-radius:14px;width:100%;max-width:560px;max-height:92svh;
  display:flex;flex-direction:column;gap:11px;padding:16px;box-shadow:0 12px 40px rgba(0,0,0,.18);
}
.modal-head{display:flex;align-items:center;gap:10px;flex-shrink:0}
.modal-title{font-size:15px;font-weight:600}
.modal-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.icon-btn{background:var(--surface);border:1.5px solid var(--border);border-radius:8px;width:30px;height:30px;font-size:14px;cursor:pointer;flex-shrink:0;color:var(--text);line-height:1}

.detail-stage{flex:1;min-height:0;overflow:auto;border:1.5px solid var(--border);border-radius:10px;background:var(--soft);display:flex;align-items:flex-start;justify-content:center}
.detail-stage canvas{max-width:100%;height:auto;display:block}
.dots{display:flex;justify-content:center;gap:5px;flex-shrink:0}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--border);display:block;transition:.15s}
.dots i.on{background:var(--text);width:16px;border-radius:3px}
.icon-btn[disabled]{opacity:.3}
.detail-tools{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;flex-shrink:0}
.sublinks{display:flex;justify-content:center;gap:16px;flex-shrink:0}
/* 읽은 글자 확인 패널 */
.readout{display:none}
.readout.show{
  display:block;margin-top:10px;max-height:34vh;overflow:auto;flex-shrink:0;
  background:var(--soft);border:1px solid var(--border);border-radius:var(--r);padding:12px 13px
}
.ro-line{font-size:13.5px;line-height:1.85;color:var(--text);word-break:break-all}
.ro-w{padding:1px 2px;border-radius:3px}
.ro-w.weak{color:#c02626;background:rgba(192,38,38,.09);font-weight:600}
.ro-foot{margin-top:9px;padding-top:9px;border-top:1px solid var(--border);font-size:11.5px;color:var(--muted)}
.ro-empty{font-size:12.5px;color:var(--muted);text-align:center;padding:6px 0}
.ro-sep{height:1px;background:var(--border);margin:12px 0}
.linkbtn{background:none;border:none;font-family:inherit;font-size:11.5px;color:var(--muted);cursor:pointer;text-decoration:underline;padding:0}
.linkbtn.on{color:var(--text);font-weight:600}
.tool.peeking{background:var(--text);color:#fff;border-color:var(--text)}
.tool{border:1.5px solid var(--border);border-radius:8px;background:var(--surface);padding:9px 2px;font-family:inherit;font-size:11.5px;font-weight:500;cursor:pointer;color:var(--text)}
.tool:active{background:var(--soft)}

.crop-wrap{position:relative;flex:1;min-height:180px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#1c1917;border-radius:10px}
.crop-wrap img{max-width:100%;max-height:100%;display:block;user-select:none;-webkit-user-drag:none}
.crop-sel{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(28,25,23,.55);cursor:move;border-radius:2px}
.crop-handle{position:absolute;width:15px;height:15px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.crop-handle[data-c=tl]{left:-7px;top:-7px;cursor:nw-resize}
.crop-handle[data-c=tr]{right:-7px;top:-7px;cursor:ne-resize}
.crop-handle[data-c=bl]{left:-7px;bottom:-7px;cursor:sw-resize}
.crop-handle[data-c=br]{right:-7px;bottom:-7px;cursor:se-resize}

.result-text{
  flex:1;min-height:0;width:100%;padding:16px;border:1.5px solid var(--border);border-radius:10px;
  font-family:inherit;font-size:14px;line-height:1.7;overflow-y:auto;
  -webkit-overflow-scrolling:touch;white-space:pre-wrap;word-break:break-all;overflow-wrap:anywhere;
}
.bg-row{display:flex;align-items:flex-start;gap:9px;flex-shrink:0}
.bg-label{font-size:11px;color:var(--muted);white-space:nowrap;padding-top:6px}
.bg-opts{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.bg-opt{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--border);cursor:pointer;flex-shrink:0;transition:.12s}
.bg-opt.on{border-color:var(--text);box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--text)}

.toast{
  position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(12px);
  background:var(--text);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;
  opacity:0;pointer-events:none;transition:.22s;z-index:300;max-width:88vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.booting{display:none;align-items:center;gap:8px;font-size:11px;color:var(--muted);margin-bottom:12px}
.booting.show{display:flex}
.booting .blip{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blip 1s ease-in-out infinite}
@keyframes blip{50%{opacity:.2}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.mark .bar{transform:scaleX(1)}}
@media (max-width:360px){.styles{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div>
      <div class="mark">가림<span class="bar"></span></div>
      <div class="tagline">사진 속 단어를 골라서 덮어요</div>
    </div>
    <div class="ver" id="ver">v30</div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tab-img" onclick="switchTab('image')">사진 가리기</button>
    <button class="tab" id="tab-txt" onclick="switchTab('text')">텍스트 치환</button>
  </div>

  <!-- ============ 사진 패널 ============ -->
  <div id="image-panel">

    <div class="booting" id="booting"><span class="blip"></span><span>글자 인식 엔진 준비 중</span></div>

    <!-- 1. 사진 -->
    <div class="sec">
      <div class="sec-title" style="display:flex;justify-content:space-between;align-items:center">
        <span>사진</span>
        <button id="clear-btn" onclick="clearAll()" style="display:none;background:none;border:none;font-family:inherit;font-size:11px;color:var(--muted);cursor:pointer;text-decoration:underline">비우기</button>
      </div>
      <input type="file" accept="image/*" multiple id="file-input" style="display:none" onchange="addFiles(this.files);this.value=''"/>
      <button class="drop" id="drop" onclick="document.getElementById('file-input').click()">
        <span class="up">↑</span>
        <span class="big">사진 고르기</span>
        <span class="small">여러 장 한 번에 골라도 돼요</span>
      </button>
      <div class="sheet" id="sheet" style="display:none"></div>
      <div class="status" id="status">
        <div class="status-line"><span id="status-label">대기</span><span id="status-pct">0%</span></div>
        <div class="bar-track"><div class="bar-fill" id="bar-fill"></div></div>
      </div>
      <div class="report" id="report"></div>
    </div>

    <!-- 2. 가릴 단어 -->
    <div class="sec">
      <div class="sec-title">가릴 단어</div>
      <div class="word-grid">
        <input class="field" type="text" id="word1" placeholder="단어 1" autocomplete="off"/>
        <input class="field" type="text" id="word2" placeholder="단어 2" autocomplete="off"/>
      </div>
      <div class="chips">
        <div class="chip" id="chip-auto" onclick="toggleAuto()"><span class="dot"></span>야한 단어 자동</div>
        <div class="chip" id="chip-cute" style="display:none" onclick="toggleCute()"><span class="dot"></span>귀여운 말로</div>
        <div class="chip" id="chip-fuzzy" onclick="toggleFuzzy()"><span class="dot"></span>오타 보정</div>
      </div>
      <div class="hint">단어를 못 찾을 때만 <b>오타 보정</b>을 켜보세요. 받침을 잘못 읽어도 찾아주지만, 비슷한 낱말까지 가릴 수 있어요.
        <button class="linkbtn" id="chip-debug" onclick="toggleDebug()">글자 인식 확인</button>
      </div>
    </div>

    <!-- 3. 덮개 -->
    <div class="sec">
      <div class="sec-title">덮개 모양</div>
      <div class="styles" id="styles">
        <div class="sty on" data-style="black" onclick="selectStyle('black')"><div class="sw sw-black"></div>검정</div>
        <div class="sty" data-style="white" onclick="selectStyle('white')"><div class="sw sw-white"></div>흰색</div>
        <div class="sty" data-style="mosaic" onclick="selectStyle('mosaic')"><div class="sw sw-mosaic"></div>모자이크</div>
        <div class="sty" data-style="emoji" onclick="selectStyle('emoji')"><div class="sw">☺</div>이모지</div>
      </div>
      <div class="emoji-wrap" id="emoji-wrap"><div class="emoji-grid" id="emoji-pick"></div></div>
    </div>

  </div>

  <!-- ============ 텍스트 패널 ============ -->
  <div class="text-panel" id="text-panel">
    <div class="sec">
      <div class="sec-title">치환 규칙</div>
      <div id="rules-list"></div>
      <button class="add-rule" onclick="addRule()">+ 규칙 추가</button>
    </div>
    <div class="sec">
      <div class="sec-title">원본 텍스트</div>
      <textarea class="ta" id="src-text" placeholder="여기에 텍스트를 붙여넣으세요"></textarea>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="openResult()">바꾸기</button>
    </div>
  </div>

</div>

<!-- 하단 액션 바 -->
<div class="dock" id="dock">
  <div class="dock-in">
    <div class="dock-count" id="dock-count"><b>0장</b>아직 안 가림</div>
    <button class="btn btn-primary" id="scan-btn" onclick="runScan()">전부 가리기</button>
    <button class="btn" id="save-all" onclick="saveAll()" style="flex:0 0 auto;padding:13px 15px">저장</button>
  </div>
</div>

<!-- ============ 상세 보기 ============ -->
<div class="modal" id="detail-modal">
  <div class="modal-box">
    <div class="modal-head">
      <div style="flex:1;min-width:0">
        <div class="modal-title" id="detail-title">01</div>
        <div class="modal-sub" id="detail-sub"></div>
      </div>
      <button class="icon-btn" id="prev-btn" onclick="goDetail(-1)" aria-label="이전 사진">‹</button>
      <button class="icon-btn" id="next-btn" onclick="goDetail(1)" aria-label="다음 사진">›</button>
      <button class="icon-btn" onclick="closeDetail()" aria-label="닫기">✕</button>
    </div>
    <div class="detail-stage" id="detail-stage"></div>
    <div class="dots" id="detail-dots"></div>
    <div class="detail-tools">
      <button class="tool" id="peek-btn" onclick="togglePeek()">원본 보기</button>
      <button class="tool" onclick="openDraw()">칠하기</button>
      <button class="tool" onclick="openCrop()">자르기</button>
      <button class="tool" onclick="saveOne()">저장</button>
    </div>
    <div class="sublinks">
      <button class="linkbtn" onclick="rescanOne()">다시 인식</button>

/* ==========================================================================
   OCR 엔진
   ========================================================================== */
(function loadTess(){
  const urls=[
    'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',
    'https://unpkg.com/tesseract.js@5.1.1/dist/tesseract.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js'
  ];
  let i=0;
  const box=document.getElementById('booting');
  box.classList.add('show');
  (function tryNext(){
    if(i>=urls.length){box.querySelector('span:last-child').textContent='엔진을 못 불러왔어요 — 새로고침해 보세요';return;}
    const s=document.createElement('script');
    s.src=urls[i];
    s.onload=()=>{tessReady=true;box.classList.remove('show');};
    s.onerror=()=>{i++;tryNext();};
    document.head.appendChild(s);
  })();
})();

let tessWorkers={}, onProg=null;
async function getWorker(lang){
  if(tessWorkers[lang])return tessWorkers[lang];
  const w=await Tesseract.createWorker(lang,1,{logger:m=>{if(onProg)onProg(m);}});
  await w.setParameters({
    tessedit_pageseg_mode:'6',
    preserve_interword_spaces:'1',
    user_defined_dpi:'300'
  });
  tessWorkers[lang]=w;
  return w;
}

/* 인식 전처리 — 언샤프로 가는 획을 살리고 대비만 완만하게 올린다.
   (지나친 이진화는 ㅣ 같은 얇은 획을 통째로 날려서 인식·경계 모두 나빠짐) */
function preprocess(img){
  let k=Math.min(2.6,Math.max(1,2200/img.width));
  const MAXPX=3.4e6;
  if(img.width*img.height*k*k>MAXPX)k=Math.sqrt(MAXPX/(img.width*img.height));
  k=Math.max(1,k);
  const W=Math.max(1,Math.round(img.width*k)),H=Math.max(1,Math.round(img.height*k));
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const ctx=c.getContext('2d',{willReadFrequently:true});
  ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  ctx.drawImage(img,0,0,W,H);
  const id=ctx.getImageData(0,0,W,H),d=id.data,N=W*H;
  const g=new Float32Array(N);
  for(let i=0,p=0;p<N;i+=4,p++)g[p]=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
  // 분리형 3탭 블러
  const t=new Float32Array(N),b=new Float32Array(N);
  for(let y=0;y<H;y++){const o=y*W;
    for(let x=0;x<W;x++){
      const l=x>0?g[o+x-1]:g[o+x],r=x<W-1?g[o+x+1]:g[o+x];
      t[o+x]=(l+g[o+x]+r)/3;
    }}
  for(let x=0;x<W;x++){
    for(let y=0;y<H;y++){
      const u=y>0?t[(y-1)*W+x]:t[y*W+x],dn=y<H-1?t[(y+1)*W+x]:t[y*W+x];
      b[y*W+x]=(u+t[y*W+x]+dn)/3;
    }}
  for(let p=0,i=0;p<N;p++,i+=4){
    let v=g[p]+(g[p]-b[p])*0.8;      // 언샤프
    v=(v-172)*1.28+182;              // 완만한 대비
    v=v<0?0:v>255?255:v;
    d[i]=d[i+1]=d[i+2]=v;
  }
  ctx.putImageData(id,0,0);
  return {canvas:c,k};
}

function unscaleOcr(data,k){
  if(k===1)return;
  const seen=new Set();
  const fix=b=>{if(!b||seen.has(b))return;seen.add(b);b.x0/=k;b.x1/=k;b.y0/=k;b.y1/=k;};
  (data.words||[]).forEach(w=>{fix(w.bbox);(w.symbols||[]).forEach(s=>fix(s.bbox));});
  (data.symbols||[]).forEach(s=>fix(s.bbox));
}

/* ==========================================================================
   한글 자모 합성
   테서랙트는 음절을 통째로 안 주고 'ㄹ'+'ㅜ' 처럼 쪼개서 줄 때가 많다.
   찾기 전에 다시 음절로 합쳐 둔다.
   ========================================================================== */
const _CHO=[...'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ'];
const _JUNG=[...'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ'];
const _JONG=[...'ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ'];
function composeJamoChars(chars){
  const out=[];
  for(let i=0;i<chars.length;i++){
    const c=chars[i];
    const ci=_CHO.indexOf(c.ch);
    if(ci>=0&&i+1<chars.length){
      const ji=_JUNG.indexOf(chars[i+1].ch);
      if(ji>=0){
        let ki=-1,used=2;
        if(i+2<chars.length){
          const k=_JONG.indexOf(chars[i+2].ch);
          if(k>=0&&!(chars[i+3]&&_JUNG.indexOf(chars[i+3].ch)>=0)){ki=k;used=3;}
        }
        out.push({ch:String.fromCharCode(0xAC00+(ci*21+ji)*28+(ki+1)),sym:c.sym,ci:c.ci,cn:c.cn});
        i+=used-1;continue;
      }
    }
    out.push(c);
  }
  return out;
}
function _noJong(ch){
  const c=ch.charCodeAt(0)-0xAC00;
  if(c<0||c>11171)return ch;
  const j=c%28;
  return j===0?ch:String.fromCharCode(0xAC00+(c-j));
}

/* ==========================================================================
   ★ 픽셀 잉크 분석 — 덮개 상자의 진짜 좌표를 여기서 만든다
   ========================================================================== */

/* 지정한 사각형의 밝기 배열과, "잉크로 칠 문턱값"을 구한다.
   문턱값을 낮게 잡는 게 핵심: 글자 가장자리의 흐릿한 반투명 픽셀(안티에일리어싱)까지
   잉크로 세야 ㅣ 같은 얇은 획의 바깥쪽 절반이 상자 밖으로 안 삐져나온다. */
function inkProfile(ctx,x0,y0,x1,y1){
  const cw=ctx.canvas.width,chh=ctx.canvas.height;
  const sx=Math.max(0,Math.floor(x0)),sy=Math.max(0,Math.floor(y0));
  const ex=Math.min(cw-1,Math.ceil(x1)),ey=Math.min(chh-1,Math.ceil(y1));
  const W=ex-sx+1,H=ey-sy+1;
  if(W<3||H<3)return null;
  let data;
  try{data=ctx.getImageData(sx,sy,W,H).data;}catch(e){return null;}
  const N=W*H,lum=new Float32Array(N);
  for(let i=0,p=0;p<N;i+=4,p++)lum[p]=0.299*data[i]+0.587*data[i+1]+0.114*data[i+2];
  const step=Math.max(1,Math.floor(N/4000));
  const s=[];for(let i=0;i<N;i+=step)s.push(lum[i]);
  s.sort((a,b)=>a-b);
  const bg=s[Math.floor(s.length*0.55)];                 // 배경 밝기(밝은 글씨도 대응)
  const dev=s.map(v=>Math.abs(v-bg)).sort((a,b)=>a-b);
  const strong=dev[Math.floor(dev.length*0.96)]||0;      // 글자 획의 대비
  const thr=Math.max(6,strong*0.13);                     // 낮은 문턱값 = 흐린 가장자리까지 포함
  return {lum,W,H,sx,sy,bg,thr};
}

/* OCR 단어 하나를 픽셀로 뜯어본다.
   반환: 글자 줄의 진짜 위/아래(top·bottom)와, 붙어 있는 잉크 덩어리 목록(runs) */
function analyzeWord(ctx,bb,approxH){
  const padX=Math.max(3,approxH*0.55);
  const p=inkProfile(ctx,bb.x0-padX,bb.y0-approxH*0.8,bb.x1+padX,bb.y1+approxH*0.8);
  if(!p)return null;
  const {lum,W,H,sx,sy,bg,thr}=p;
  // 가로 줄 훑기는 '단어가 있는 x범위'에서만 한다 (옆 여백까지 세면 말풍선 배경에 속는다)
  const rx0=Math.max(0,Math.round(bb.x0-sx)),rx1=Math.min(W-1,Math.round(bb.x1-sx));
  const rangeW=Math.max(1,rx1-rx0+1);
  const rowInk=new Int32Array(H);
  for(let y=0;y<H;y++){
    const o=y*W;let n=0;
    for(let x=rx0;x<=rx1;x++)if(Math.abs(lum[o+x]-bg)>thr)n++;
    rowInk[y]=n;
  }
  const minRow=Math.max(1,Math.round(rangeW*0.006));
  // 한 줄이 통째로 꽉 찬 건 글자가 아니라 말풍선·색 배경이다. 글자 줄은 절대 꽉 차지 않는다.
  const maxRow=rangeW*0.9;
  const isText=y=>rowInk[y]>=minRow&&rowInk[y]<=maxRow;
  let cy=Math.round((bb.y0+bb.y1)/2-sy);
  cy=Math.max(0,Math.min(H-1,cy));
  if(!isText(cy)){
    let f=-1;
    for(let d=1;d<H;d++){
      if(cy-d>=0&&isText(cy-d)){f=cy-d;break;}
      if(cy+d<H&&isText(cy+d)){f=cy+d;break;}
    }
    if(f<0)return null;
    cy=f;
  }
  // 중심 행에서 위·아래로 번져 나가며 글자 줄의 끝을 찾는다.
  // 자음과 모음 사이 빈 줄 정도는 건너뛰고, 줄 간격만큼 비면 멈춘다.
  const gapTol=Math.max(1,Math.round(approxH*0.17));
  let top=cy,g=0;
  for(let y=cy;y>=0;y--){if(isText(y)){top=y;g=0;}else{g++;if(g>gapTol)break;}}
  g=0;let bot=cy;
  for(let y=cy;y<H;y++){if(isText(y)){bot=y;g=0;}else{g++;if(g>gapTol)break;}}
  // 윗줄/아랫줄까지 삼켰으면 포기하고 OCR 상자를 쓴다
  if(bot-top>approxH*1.9){
    // 위아래 줄까지 삼킨 경우 — 글자 중심 기준으로 한 줄 높이만 남긴다
    const half=Math.round(approxH*0.62);
    top=Math.max(0,cy-half);bot=Math.min(H-1,cy+half);
  }
  const bandH=Math.max(4,bot-top+1);
  const colInk=new Int32Array(W);
  for(let y=top;y<=bot;y++){
    const o=y*W;
    for(let x=0;x<W;x++)if(Math.abs(lum[o+x]-bg)>thr)colInk[x]++;
  }
  const minCol=Math.max(1,Math.round(bandH*0.035));
  const runs=[];let s0=null;
  for(let x=0;x<W;x++){
    if(colInk[x]>=minCol){if(s0===null)s0=x;}
    else if(s0!==null){runs.push({x0:s0,x1:x-1});s0=null;}
  }
  if(s0!==null)runs.push({x0:s0,x1:W-1});
  // 옆 글자의 덩어리는 버린다 — 덩어리의 '중심'이 단어 범위 안에 있어야 내 것으로 친다.
  // (걸치기만 해도 받아 주면, 한 글자짜리 단어일 때 옆 글자를 통째로 삼켜 버린다)
  const lo=bb.x0-approxH*0.12-sx,hi=bb.x1+approxH*0.12-sx;
  let keep=runs.filter(r=>{const c=(r.x0+r.x1)/2;return c>=lo&&c<=hi;});
  if(!keep.length)keep=runs.filter(r=>r.x1>=lo&&r.x0<=hi);
  return {sx,sy,W,H,colInk,runs:keep.length?keep:runs,top:top+sy,bottom:bot+sy,lineH:bandH,
          bx0:bb.x0-sx,bx1:bb.x1-sx};
}

/* 잉크 덩어리를 글자 칸으로 나눈다.
   한글은 글자마다 폭이 똑같다(고정 너비)는 점을 이용한다.
   ① 큰 틈(띄어쓰기)에서 덩어리 묶음으로 자르고
   ② 묶음 너비에 비례해 글자 수를 나눠 준 뒤
   ③ 묶음 안을 균등 분할하고 그 경계를 실제 틈으로 살짝 당겨 붙인다.
   틈 크기만 보고 합치면 'ㅇ'과 'ㅣ' 사이 틈이 '그'와 '의' 사이 틈과 똑같아서 엉뚱하게 붙는다. */
function toCharBoxes(an,chars){
  if(!an||!an.runs||!an.runs.length||!chars||!chars.length)return null;
  const runs=an.runs.slice().sort((a,b)=>a.x0-b.x0);
  // ★ 따옴표(" ')처럼 글자 줄 위쪽에 떠 있는 기호는 잉크 덩어리로 안 잡힐 때가 있다.
  //   그때 글자 수만 믿고 덩어리를 쪼개면 칸이 통째로 한 칸씩 밀려서
  //   덮개가 글자 앞부분을 잘라먹는다. 덩어리 수에 더 가까운 쪽을 골라 쓴다.
  const isLetter=chars.map(c=>/[\p{L}\p{N}]/u.test(c.ch));
  const nAll=chars.length,nLet=isLetter.filter(Boolean).length;
  const useAll=nLet<1||Math.abs(runs.length-nAll)<=Math.abs(runs.length-nLet);
  const n=useAll?nAll:nLet;
  if(!n)return null;
  if(runs.length<Math.ceil(n/3))return null;
  const lineH=Math.max(4,an.lineH);

  // ① 띄어쓰기 크기의 틈에서 묶음으로 자르기
  const bigGap=Math.max(2,lineH*0.30);
  const blocks=[];let cur=[runs[0]];
  for(let i=1;i<runs.length;i++){
    if(runs[i].x0-cur[cur.length-1].x1>=bigGap){blocks.push(cur);cur=[runs[i]];}
    else cur.push(runs[i]);
  }
  blocks.push(cur);
  const bw=blocks.map(b=>Math.max(1,b[b.length-1].x1-b[0].x0+1));
  const total=bw.reduce((a,b)=>a+b,0);
  if(blocks.length>n)return null;

  // ② 글자 수 배분 (최대 나머지 방식)
  const want=bw.map(w=>n*w/total);
  const alloc=want.map(v=>Math.max(1,Math.floor(v)));
  let sum=alloc.reduce((a,b)=>a+b,0),guard=0;
  while(sum<n&&guard++<500){
    let bi=0,best=-Infinity;
    for(let i=0;i<alloc.length;i++){const s=want[i]-alloc[i];if(s>best){best=s;bi=i;}}
    alloc[bi]++;sum++;
  }
  guard=0;
  while(sum>n&&guard++<500){
    let bi=-1,best=-Infinity;
    for(let i=0;i<alloc.length;i++){
      if(alloc[i]<=1)continue;
      const s=alloc[i]-want[i];
      if(s>best){best=s;bi=i;}
    }
    if(bi<0)break;
    alloc[bi]--;sum--;
  }
  if(sum!==n)return null;

  // ③ 묶음 안을 '글자 폭 비율'대로 나눈 뒤 실제 틈으로 스냅
  //    한글은 폭이 같지만 따옴표·쉼표는 훨씬 좁다.
  //    이걸 무시하고 똑같이 나누면 칸 경계가 통째로 밀려서
  //    덮개가 글자 오른쪽을 잘라먹는다.  " 아 가 야 ,  ← 이런 조합에서 특히.
  const used=[];
  for(let i=0;i<nAll;i++)if(useAll||isLetter[i])used.push(chars[i].ch);
  const widthOf=ch=>{
    if(/[\uAC00-\uD7A3\u3130-\u318F\u4E00-\u9FFF\u3040-\u30FF]/.test(ch))return 1;      // 한글·한자·가나
    if(/[0-9A-Za-z]/.test(ch))return 0.62;                                                  // 영문·숫자
    return 0.42;                                                                            // 따옴표·쉼표 등
  };
  const wts=used.map(widthOf);
  const cells=[];
  let ci=0;
  blocks.forEach((b,bi)=>{
    const k=alloc[bi],bx0=b[0].x0,bx1=b[b.length-1].x1;
    const my=wts.slice(ci,ci+k);ci+=k;
    let tw=0;my.forEach(v=>tw+=v);
    if(!(tw>0)){tw=k;for(let i=0;i<k;i++)my[i]=1;}
    const span=bx1-bx0+1,unit=span/tw;
    const gaps=[];
    for(let i=0;i<b.length-1;i++)gaps.push((b[i].x1+b[i+1].x0)/2);
    const cuts=[bx0-0.5];
    let acc=0;
    for(let i=0;i<k-1;i++){
      acc+=my[i];
      const ideal=bx0+unit*acc;
      const win=Math.max(unit*my[i],unit*(my[i+1]||1))*0.4;
      let pick=ideal,bd=win;
      gaps.forEach(g=>{const d=Math.abs(g-ideal);if(d<bd){bd=d;pick=g;}});
      cuts.push(Math.max(cuts[cuts.length-1]+1,pick));
    }
    cuts.push(Math.max(cuts[cuts.length-1]+1,bx1+0.5));
    for(let i=0;i<k;i++)cells.push({x0:cuts[i],x1:cuts[i+1]});
  });
  if(cells.length!==n)return null;

  // ④ 칸에 걸친 잉크 덩어리를 품게 넓힌다.
  //    단, 덩어리의 '대부분'이 그 칸 안에 있을 때만.
  //    중심만 보고 넓히면, 칸 경계가 다음 글자의 첫 획(예: '가'의 ㄱ) 뒤에 떨어졌을 때
  //    그 획을 통째로 삼켜서 "루루ㄱ" 처럼 옆 글자까지 가려진다.
  const bounds=cells.map(c=>({x0:c.x0,x1:c.x1}));
  runs.forEach(r=>{
    const rw=Math.max(1,r.x1-r.x0+1);
    let bi=-1,bo=0;
    for(let i=0;i<bounds.length;i++){
      const ov=Math.min(r.x1,bounds[i].x1)-Math.max(r.x0,bounds[i].x0)+1;
      if(ov>bo){bo=ov;bi=i;}
    }
    if(bi<0||bo/rw<0.6)return;      // 절반 넘게 들어와 있지 않으면 남의 글자로 본다
    cells[bi].x0=Math.min(cells[bi].x0,r.x0);
    cells[bi].x1=Math.max(cells[bi].x1,r.x1);
  });
  // 칸끼리 겹치지 않게 정리 (넓히다 이웃을 침범했을 수 있다)
  for(let i=1;i<cells.length;i++){
    if(cells[i].x0<cells[i-1].x1){
      const mid=(cells[i].x0+cells[i-1].x1)/2;
      cells[i-1].x1=mid;cells[i].x0=mid;
    }
  }
  // ⑤ 바깥쪽 칸은 OCR 단어 상자에서 너무 멀리 벗어나지 않게 묶어 둔다
  if(an.bx0!=null){
    const slack=lineH*0.15;
    cells[0].x0=Math.max(cells[0].x0,an.bx0-slack);
    cells[n-1].x1=Math.min(cells[n-1].x1,an.bx1+slack);
    if(cells[0].x1<=cells[0].x0)cells[0].x1=cells[0].x0+1;
    if(cells[n-1].x1<=cells[n-1].x0)cells[n-1].x1=cells[n-1].x0+1;
  }
  const made=cells.map(c=>({x0:c.x0+an.sx,x1:c.x1+an.sx}));
  if(useAll)return made;
  // 글자 칸만 만들었으므로 기호 자리는 비워 둔다 (찾기에 쓰이지 않는 자리)
  const out=[];let k=0;
  for(let i=0;i<nAll;i++)out.push(isLetter[i]?made[k++]:null);
  return out;
}

/* 덮개가 실제로 덮어야 할 세로 범위를, 그 자리 글자만 보고 잰다.
   줄 전체의 잉크 띠를 쓰면 그 줄 어딘가의 깊은 받침이나 따옴표 때문에
   덮개가 필요 이상으로 커진다. */
function inkVertical(ctx,x0,x1,bandTop,bandBottom,approxH){
  const m=Math.max(2,Math.round(approxH*0.5));
  const p=inkProfile(ctx,x0,bandTop-m,x1,bandBottom+m);
  if(!p)return null;
  const {lum,W,H,sx,sy,bg,thr}=p;
  const rowInk=new Int32Array(H);
  for(let y=0;y<H;y++){
    const o=y*W;let n=0;
    for(let xx=0;xx<W;xx++)if(Math.abs(lum[o+xx]-bg)>thr)n++;
    rowInk[y]=n;
  }
  const minRow=Math.max(1,Math.round(W*0.02));
  const maxRow=W*0.94;
  const ok=y=>rowInk[y]>=minRow&&rowInk[y]<=maxRow;
  let cy=Math.round((bandTop+bandBottom)/2-sy);
  cy=Math.max(0,Math.min(H-1,cy));
  if(!ok(cy)){
    let f=-1;
    for(let d=1;d<H;d++){
      if(cy-d>=0&&ok(cy-d)){f=cy-d;break;}
      if(cy+d<H&&ok(cy+d)){f=cy+d;break;}
    }
    if(f<0)return null;
    cy=f;
  }
  // '루'의 ㄹ과 ㅜ 사이처럼 한 글자 안에도 가로로 빈 줄이 생긴다.
  // 이 틈을 못 건너면 글자의 절반만 재고 덮개가 위로 붕 뜬다.
  // 줄과 줄 사이 간격보다는 작게 잡아 아랫줄까지 삼키지는 않게 한다.
  const gapTol=Math.max(2,Math.round(approxH*0.32));
  let top=cy,g=0;
  for(let y=cy;y>=0;y--){if(ok(y)){top=y;g=0;}else{g++;if(g>gapTol)break;}}
  g=0;let bot=cy;
  for(let y=cy;y<H;y++){if(ok(y)){bot=y;g=0;}else{g++;if(g>gapTol)break;}}
  if(bot-top>approxH*1.7)return null;   // 아랫줄까지 삼켰으면 포기하고 줄 띠를 쓴다
  return {top:top+sy,bottom:bot+sy};
}

/* ==========================================================================
   OCR 결과 → 줄 단위 글자 흐름
   ========================================================================== */
function charsOfWord(w){
  const raw=[];
  if(w.symbols&&w.symbols.length){
    w.symbols.forEach(s=>{
      const cs=[...(s.text||'').normalize('NFC')].filter(ch=>!/\s/.test(ch));
      cs.forEach((ch,ci)=>raw.push({ch,sym:s,ci,cn:cs.length}));
    });
  }else{
    const cs=[...(w.text||'').normalize('NFC')].filter(ch=>!/\s/.test(ch));
    cs.forEach(ch=>raw.push({ch,sym:null,ci:0,cn:1}));
  }
  return composeJamoChars(raw);
}

/* 단어들을 y좌표로 줄 묶음 → 각 줄마다 픽셀 분석 + 글자상자 생성 */
function buildLines(words,srcCtx,medH){
  const items=[];
  words.forEach(w=>{
    if(!w.bbox)return;
    const t=(w.text||'').trim();
    if(!t)return;
    const h=w.bbox.y1-w.bbox.y0;
    if(h<3)return;
    items.push({w,cy:(w.bbox.y0+w.bbox.y1)/2,h});
  });
  // 줄 묶기는 '사진 전체 글자 높이의 중앙값'을 기준으로 한다.
  // OCR이 가끔 두 줄에 걸친 엉뚱하게 큰 상자를 내놓는데,
  // 그 상자 높이를 기준으로 삼으면 위아래 두 줄이 한 줄로 합쳐져 버린다.
  const lines=[];
  items.sort((a,b)=>a.cy-b.cy).forEach(o=>{
    let L=null;
    for(const c of lines){if(Math.abs(c.cy-o.cy)<medH*0.62){L=c;break;}}
    if(!L){L={cy:o.cy,items:[]};lines.push(L);}
    L.items.push(o);
    L.cy=(L.cy*(L.items.length-1)+o.cy)/L.items.length;
  });
  lines.forEach(L=>{
    L.items.sort((a,b)=>a.w.bbox.x0-b.w.bbox.x0);
    // 줄 높이도 최댓값이 아니라 중앙값으로 — 튀는 상자 하나에 끌려가지 않게
    const hh=L.items.map(o=>o.h).sort((a,b)=>a-b);
    const lineMed=hh[hh.length>>1]||medH;
    const approxH=Math.max(6,Math.min(lineMed,medH*1.5));

    // ★ 겹치는 OCR 상자 정리
    //   테서랙트는 '루' 상자를 옆 글자 '는'까지 덮도록 넓게 주면서
    //   그 안에 '는' 상자를 또 겹쳐 놓는 일이 잦다. 그대로 두면 '루' 한 글자를
    //   찾았는데 옆 글자까지 같이 지워진다. 이웃 상자 시작점에서 잘라 준다.
    const bbs=L.items.map(o=>({x0:o.w.bbox.x0,y0:o.w.bbox.y0,x1:o.w.bbox.x1,y1:o.w.bbox.y1}));
    for(let i=0;i<bbs.length;i++){
      const b=bbs[i],nx=bbs[i+1],pv=bbs[i-1];
      const ox0=b.x0,ox1=b.x1;
      if(pv&&pv.x1>b.x0&&pv.x1<b.x1)b.x0=pv.x1;
      if(nx&&nx.x0>b.x0+2&&nx.x0<b.x1)b.x1=nx.x0;
      if(b.x1-b.x0<3){b.x0=ox0;b.x1=ox1;}
    }
    L.items.forEach((o,i)=>{o.bb=bbs[i];});

    const bands=[];
    L.stream=[];
    L.items.forEach(o=>{
      const chars=charsOfWord(o.w);
      if(!chars.length)return;
      const an=analyzeWord(srcCtx,o.bb,approxH);
      let boxes=an?toCharBoxes(an,chars):null;
      if(an)bands.push({t:an.top,b:an.bottom});
      if(!boxes){
        // 픽셀 분석이 실패하면 OCR 상자를 글자 수로 균등 분할 (안전한 대비책)
        const bb=o.bb,u=(bb.x1-bb.x0)/chars.length;
        boxes=chars.map((_,i)=>({x0:bb.x0+u*i,x1:bb.x0+u*(i+1)}));
      }
      const wi=L.stream.length?L.stream[L.stream.length-1].wi+1:0;
      chars.forEach((c,i)=>L.stream.push({ch:c.ch,box:boxes[i],word:o.w,wi}));
    });
    // 줄의 위·아래: 가운데에서 크게 벗어나거나 비정상적으로 키 큰 띠는 빼고 합친다
    let top,bot;
    if(bands.length){
      const cs=bands.map(b=>(b.t+b.b)/2).sort((a,b)=>a-b);
      const mid=cs[cs.length>>1];
      const ok=bands.filter(b=>Math.abs((b.t+b.b)/2-mid)<approxH*0.55&&(b.b-b.t)<approxH*1.8);
      const use=ok.length?ok:bands;
      top=Math.min.apply(null,use.map(b=>b.t));
      bot=Math.max.apply(null,use.map(b=>b.b));
      // 그래도 두 줄을 삼킬 만큼 크면 가운데 기준으로 잘라 낸다
      if(bot-top>approxH*1.55){
        const h=approxH*1.3;
        top=Math.round(mid-h/2);bot=Math.round(mid+h/2);
      }
    }else{
      top=Math.min.apply(null,L.items.map(o=>o.bb.y0));
      bot=Math.max.apply(null,L.items.map(o=>o.bb.y1));
    }
    L.top=top;L.bottom=bot;
    L.lineH=Math.max(6,bot-top+1);
    L.approxH=approxH;
    // 찾기용 문자열 + 원래 위치 되돌림표
    let plain='';const map=[];
    L.stream.forEach((s,i)=>{
      if(s.box&&/[\p{L}\p{N}]/u.test(s.ch)){plain+=s.ch.toLowerCase();map.push(i);}
    });
    L.plain=plain;L.map=map;
    L.skel=[...plain].map(_noJong).join('');
    // 글자 간격(pitch) — 한글은 글자 폭이 일정해서 상자 크기를 맞추는 기준이 된다.
    // 이웃 글자 중심 사이 거리를 모아 중앙값을 쓴다. 띄어쓰기만큼 벌어진 간격은 뺀다.
    const gaps=[];
    for(let i=1;i<L.stream.length;i++){
      const p=L.stream[i-1],c=L.stream[i];
      if(!p.box||!c.box)continue;
      const d=(c.box.x0+c.box.x1)/2-(p.box.x0+p.box.x1)/2;
      if(d>approxH*0.62&&d<approxH*1.35)gaps.push(d);
    }
    gaps.sort((a,b)=>a-b);
    let pitch=gaps.length?gaps[gaps.length>>1]:0;
    // 표본이 너무 적으면(짧은 줄) 낱말 상자 폭으로 어림잡는다
    if(gaps.length<3){
      const adv=[];
      L.items.forEach(o=>{
        const cs=charsOfWord(o.w);
        const han=cs.filter(c=>/[\uAC00-\uD7A3\u4E00-\u9FFF]/.test(c.ch)).length;
        if(!han||han!==cs.length)return;
        const w=o.bb.x1-o.bb.x0;
        if(w>0)adv.push(w/han*1.06);      // 잉크 폭 → 글자 간격 보정
      });
      adv.sort((a,b)=>a-b);
      if(adv.length)pitch=adv[adv.length>>1];
    }
    if(!(pitch>0))pitch=approxH;
    L.pitch=pitch;

    // ★ 칸 폭 상한
    //   OCR이 낱말 상자를 옆 글자 첫 획까지 넓게 주는 일이 잦다.
    //   ('가'처럼 ㄱ과 ㅏ가 떨어진 글자 앞에서 특히)
    //   한글은 글자 폭이 일정하니, 글자 간격보다 눈에 띄게 넓은 칸은 잘라 낸다.
    // 상한은 '글자 간격'과 '이 줄 칸 폭의 중앙값' 중 작은 쪽으로.
    // 줄이 짧아 글자 간격 추정이 흔들려도, 칸 폭 중앙값이 잡아 준다.
    const cws=[];
    L.stream.forEach(s=>{if(s.box&&/[\uAC00-\uD7A3\u4E00-\u9FFF]/.test(s.ch))cws.push(s.box.x1-s.box.x0);});
    cws.sort((a,b)=>a-b);
    const medCW=cws.length?cws[cws.length>>1]:L.pitch;
    const cap=Math.min(L.pitch*1.12,medCW*1.25);
    for(let i=0;i<L.stream.length;i++){
      const s=L.stream[i];
      if(!s.box)continue;
      if(!/[\uAC00-\uD7A3\u4E00-\u9FFF]/.test(s.ch))continue;   // 한글·한자만
      const w=s.box.x1-s.box.x0;
      if(w<=cap)continue;
      let pv=null,nx=null;
      for(let j=i-1;j>=0;j--)if(L.stream[j].box){pv=L.stream[j];break;}
      for(let j=i+1;j<L.stream.length;j++)if(L.stream[j].box){nx=L.stream[j];break;}
      // 이웃과 자연스럽게 붙어 있는 쪽을 믿고, 반대쪽을 잘라 낸다
      const leftOK=pv?Math.abs(s.box.x0-pv.box.x1)<L.pitch*0.45:true;
      const rightOK=nx?Math.abs(nx.box.x0-s.box.x1)<L.pitch*0.45:true;
      if(leftOK&&!rightOK)s.box={x0:s.box.x0,x1:s.box.x0+cap};
      else if(rightOK&&!leftOK)s.box={x0:s.box.x1-cap,x1:s.box.x1};
      else if(leftOK)s.box={x0:s.box.x0,x1:s.box.x0+cap};
      else{const c=(s.box.x0+s.box.x1)/2;s.box={x0:c-cap/2,x1:c+cap/2};}
    }
  });
  const use=lines.filter(L=>L.plain);
  // ★ 글자 크기가 같은 줄끼리 상자 높이·글자폭을 하나로 통일한다.
  //   줄마다 1~3px씩 달라 보이던 게 사라진다.
  const buckets={};
  use.forEach(L=>{const k=Math.round(Math.log(Math.max(4,L.approxH))/Math.log(1.28));(buckets[k]=buckets[k]||[]).push(L);});
  Object.keys(buckets).forEach(k=>{
    const g=buckets[k];
    const hs=g.map(L=>L.bottom-L.top).sort((a,b)=>a-b);
    const ps=g.map(L=>L.pitch).sort((a,b)=>a-b);
    // 높이는 '가장 큰 줄'에 맞춘다. 평균이나 상위 80%로 맞추면
    // 받침이 깊거나 획이 위로 솟은 줄에서 글자 끝이 상자 밖으로 삐져나온다.
    // (줄마다 이미 한 줄 높이로 제한해 뒀으니 이 최댓값이 터무니없이 커지지 않는다)
    const H=hs[hs.length-1];
    const P=ps[ps.length>>1];
    g.forEach(L=>{
      const c=(L.top+L.bottom)/2;
      L.top=Math.round(c-H/2);L.bottom=Math.round(c+H/2);
      L.lineH=Math.max(6,L.bottom-L.top);
      L.pitch=P;
    });
  });
  return use;
}

/* ==========================================================================
   덮개 그리기
   ========================================================================== */
function drawMosaic(ctx,srcCtx,x,y,w,h){
  const block=Math.max(4,Math.round(h/4));
  const cw=srcCtx.canvas.width,chh=srcCtx.canvas.height;
  for(let bx=x;bx<x+w;bx+=block){
    for(let by=y;by<y+h;by+=block){
      const sx=Math.min(Math.max(0,bx+(block>>1)),cw-1);
      const sy=Math.min(Math.max(0,by+(block>>1)),chh-1);
      let p;try{p=srcCtx.getImageData(sx,sy,1,1).data;}catch(e){p=[180,180,180];}
      ctx.fillStyle=`rgb(${p[0]},${p[1]},${p[2]})`;
      ctx.fillRect(bx,by,Math.min(block,x+w-bx),Math.min(block,y+h-by));
    }
  }
}

const _spriteCache={};
function labelSprite(text){
  if(_spriteCache[text])return _spriteCache[text];
  const fp=64;
  const oc=document.createElement('canvas');
  oc.width=Math.ceil(fp*(text.length+2));oc.height=fp*2;
  const c=oc.getContext('2d',{willReadFrequently:true});
  c.font=fp+'px sans-serif';c.textBaseline='middle';
  c.lineJoin='round';c.lineWidth=Math.round(fp/6);c.strokeStyle='#ffffff';
  c.strokeText(text,fp/2,fp);
  c.fillStyle='#14121A';c.fillText(text,fp/2,fp);
  const W=oc.width,H=oc.height,d=c.getImageData(0,0,W,H).data;
  let minX=W,maxX=-1,minY=H,maxY=-1;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(d[(y*W+x)*4+3]>10){if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;}
  }
  const sp=maxX<0?null:{canvas:oc,sx:minX,sy:minY,sw:maxX-minX+1,sh:maxY-minY+1};
  _spriteCache[text]=sp;return sp;
}

const _emojiSpriteCache={};
function emojiSprite(emoji,fp){
  fp=fp||64;
  const key=emoji+'@'+fp;
  if(_emojiSpriteCache[key])return _emojiSpriteCache[key];
  const oc=document.createElement('canvas');
  oc.width=fp*2;oc.height=fp*2;
  const c=oc.getContext('2d',{willReadFrequently:true});
  c.font=fp+'px serif';c.textBaseline='middle';c.textAlign='left';
  c.fillText(emoji,fp/2,fp);
  const W=oc.width,H=oc.height,d=c.getImageData(0,0,W,H).data;
  let minX=W,maxX=-1,minY=H,maxY=-1;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(d[(y*W+x)*4+3]>10){if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;}
  }
  const sp=maxX<0?null:{canvas:oc,sx:minX,sy:minY,sw:maxX-minX+1,sh:maxY-minY+1};
  _emojiSpriteCache[key]=sp;return sp;
}

function drawCensor(ctx,srcCtx,canvas,x,y,w,h,label){
  const rx=Math.max(0,Math.round(x)),ry=Math.max(0,Math.round(y));
  const rw=Math.min(Math.round(w),canvas.width-rx);
  const rh=Math.min(Math.round(h),canvas.height-ry);
  if(rw<=0||rh<=0)return;
  if(currentStyle==='black'){ctx.fillStyle='#14121A';ctx.fillRect(rx,ry,rw,rh);}
  else if(currentStyle==='white'){ctx.fillStyle='#ffffff';ctx.fillRect(rx,ry,rw,rh);}
  else if(currentStyle==='mosaic'){drawMosaic(ctx,srcCtx,rx,ry,rw,rh);}
  else if(currentStyle==='emoji'){
    drawMosaic(ctx,srcCtx,rx,ry,rw,rh);
    const fs=Math.min(96,Math.max(20,Math.round(rh*1.05)));
    const sp=emojiSprite(selectedEmoji,fs);
    if(sp){
      ctx.save();ctx.beginPath();ctx.rect(rx,ry,rw,rh);ctx.clip();
      const scale=Math.min(rw*0.98/sp.sw,rh*0.98/sp.sh,1.4);
      const dw=sp.sw*scale,dh=sp.sh*scale;
      ctx.drawImage(sp.canvas,sp.sx,sp.sy,sp.sw,sp.sh,rx+(rw-dw)/2,ry+(rh-dh)/2,dw,dh);
      ctx.restore();
    }
  }
  if(label){
    const cands=label.startsWith('~')?[label,label.replace(/~/g,'')]
      :[label,label.replace(/[\u3131-\u3163]$/,''),'❤️‍🔥'];
    const maxW=rw-Math.max(4,Math.round(rw*0.08)),maxH=Math.round(rh*0.72);
    for(let i=0;i<cands.length;i++){
      const sp=labelSprite(cands[i]);
      if(!sp)continue;
      const scale=Math.min(maxW/sp.sw,maxH/sp.sh);
      const dw=sp.sw*scale,dh=sp.sh*scale;
      if(dh<rh*0.32&&i<cands.length-1)continue;
      ctx.drawImage(sp.canvas,sp.sx,sp.sy,sp.sw,sp.sh,rx+(rw-dw)/2,ry+(rh-dh)/2,dw,dh);
      break;
    }
  }
}

/* ==========================================================================
   ★ 한 장에 덮개 적용
   ========================================================================== */
function buildTargets(){
  const g=id=>document.getElementById(id).value.trim().normalize('NFC').toLowerCase();
  const out=[];
  [g('word1'),g('word2')].forEach(s=>{
    const c=s.replace(/[^\p{L}\p{N}]/gu,'');
    if(c&&!out.some(e=>e.sw===c))out.push({sw:c,auto:false,latin:/^[a-z0-9]+$/i.test(c)});
  });
  if(autoFilter)AUTO_WORDS.forEach(a=>{
    const c=a.toLowerCase().replace(/[^\p{L}\p{N}]/gu,'');
    if(c&&!out.some(e=>e.sw===c))out.push({sw:c,auto:true,latin:false});
  });
  return out;
}

function censorShot(shot){
  const canvas=shot.out,ctx=canvas.getContext('2d',{willReadFrequently:true});
  ctx.drawImage(shot.img,0,0);
  shot.count=0;shot.missed=[];
  const targets=buildTargets();
  if(!shot.ocr||!targets.length){paintThumb(shot);return;}

  const srcCtx=shot.srcCtx;
  const korData=shot.ocr.kor,engData=shot.ocr.eng;
  const korTargets=targets.filter(t=>!t.latin),engTargets=targets.filter(t=>t.latin);

  const allW=[...(korData.words||[]),...((engData&&engData.words)||[])];
  const hs=allW.map(w=>w.bbox.y1-w.bbox.y0).filter(h=>h>2).sort((a,b)=>a-b);
  const medH=hs.length?hs[Math.floor(hs.length/2)]:20;

  const drawn=[],found=[];
  const hitCount=new Map();targets.forEach(t=>hitCount.set(t.sw,0));

  function overlaps(x0,x1,y0,y1){
    for(const r of drawn){
      const ix=Math.min(x1,r.x1)-Math.max(x0,r.x0);
      const iy=Math.min(y1,r.y1)-Math.max(y0,r.y0);
      if(ix>0&&iy>0&&ix*iy>0.3*Math.min((x1-x0)*(y1-y0),(r.x1-r.x0)*(r.y1-r.y0)))return true;
    }
    return false;
  }

  // 줄 분석 결과는 사진마다 한 번만 계산해 두고 다시 쓴다.
  // (단어를 고쳐 칠 때마다 픽셀을 다시 훑으면 느려요)
  if(!shot.lines)shot.lines={};
  function linesFor(key,words){
    if(!shot.lines[key])shot.lines[key]=buildLines(words,srcCtx,medH);
    return shot.lines[key];
  }
  function pass(key,words,tset){
    if(!tset.length||!words||!words.length)return;
    const lines=linesFor(key,words);
    lines.forEach(L=>{
      tset.forEach(t=>{
        const hay=[{s:L.plain,exact:true}];
        const hits=[];
        let idx=L.plain.indexOf(t.sw);
        while(idx>=0){hits.push(idx);idx=L.plain.indexOf(t.sw,idx+1);}
        // 오타 보정 — 받침만 틀리게 읽힌 경우 한 번 더
        if(!hits.length&&fuzzyMode&&t.sw.length>=2&&/^[가-힣]+$/.test(t.sw)){
          const sk=[...t.sw].map(_noJong).join('');
          let j=L.skel.indexOf(sk);
          while(j>=0){hits.push(j);j=L.skel.indexOf(sk,j+1);}
        }
        hits.forEach(i=>{
          const len=t.sw.length;
          if(i+len>L.map.length)return;
          const a=L.stream[L.map[i]],b=L.stream[L.map[i+len-1]];
          if(!a||!b||!a.box||!b.box)return;
          const pv=L.map[i-1]!=null?L.stream[L.map[i-1]]:null;
          const nx=L.map[i+len]!=null?L.stream[L.map[i+len]]:null;
          // 영어는 낱말 경계 확인 (his 안의 is 같은 걸 가리지 않도록).
          // plain 은 띄어쓰기를 뺀 문자열이라 그것만 보면 모든 영단어가 붙어 보인다.
          // 실제로 낱말이 나뉘었는지는 OCR 낱말 번호와 글자 사이 간격으로 판단한다.
          if(t.latin){
            const gapL=L.pitch*0.35,gapR=L.pitch*0.35;
            const brk=(p,q,g)=>!p||!q||p.wi!==q.wi||(q.box&&p.box&&q.box.x0-p.box.x1>g);
            if(!brk(pv,a,gapL))return;
            if(!brk(b,nx,gapR))return;
          }
          let x0=a.box.x0,x1=b.box.x1;
          // ★ 상자 크기 통일: 글자 수 × 글자 간격.
          //   한글은 글자 폭이 일정하니 같은 단어면 어디서 찾든 같은 크기가 나온다.
          // 상자 크기 통일: '글자 수 × 글자 간격' 을 기본으로 하되
          // 잉크가 더 넓으면 잉크를 따르고, 양쪽에 같은 여유를 준다.
          const ideal=Math.round(len*L.pitch);
          const bleed=Math.max(2,Math.round(L.pitch*0.09));
          const cx=(x0+x1)/2;
          const w=Math.max(ideal,x1-x0)+bleed*2;
          x0=Math.round(cx-w/2);x1=x0+w;
          // 옆 글자 안쪽까지 파고들지는 않게 — 글자 간격의 12%까지만 허용
          const room=L.pitch*0.06;
          if(pv&&pv.box)x0=Math.max(x0,Math.min(pv.box.x1,a.box.x0)-room);
          if(nx&&nx.box)x1=Math.min(x1,Math.max(nx.box.x0,b.box.x1)+room);
          // 마지막 안전장치 — 어떤 계산을 거쳤든 글자 칸보다 좁아지지는 않게
          x0=Math.min(x0,a.box.x0);x1=Math.max(x1,b.box.x1+1);
          if(!(x1>x0))return;
          const lbl=t.auto?(cuteMode?'~'+(CUTE_MAP[t.sw]||t.sw)+'~':autoLabel(t.sw)):null;
          found.push({L,x0,x1,lbl,sw:t.sw,ix0:a.box.x0,ix1:b.box.x1});
          hitCount.set(t.sw,hitCount.get(t.sw)+1);
        });
      });
    });
  }

  pass('kor',korData.words||[],korTargets);
  pass('eng',(engData&&engData.words)||korData.words||[],engTargets);

  // ★ 세로 크기 정하기
  //   ① 덮을 자리의 글자만 보고 실제 높이를 잰다 (줄 전체가 아니라)
  //   ② 글자 크기가 같은 것끼리 가장 큰 값으로 맞춰 사진 안에서 크기를 통일한다
  found.forEach(f=>{
    // 세로 측정은 옆 글자가 안 섞이게 '글자 칸' 범위에서만
    const v=inkVertical(srcCtx,f.ix0,f.ix1,f.L.top,f.L.bottom,f.L.approxH);
    // 측정값은 '잉크가 있는 마지막 줄'이고 상자는 [y0,y1) 범위를 칠하므로
    // 아래쪽은 +1 을 더해야 마지막 줄까지 덮인다. 흐린 가장자리 몫으로 1px 더.
    const t=(v?v.top:f.L.top)-1,b=(v?v.bottom:f.L.bottom)+2;
    f.top=t;f.bot=b;f.cy=(t+b)/2;f.ih=Math.max(4,b-t);
  });
  // 같은 '단어 + 같은 글자 크기'끼리만 높이를 맞춘다.
  // 모든 단어를 한 크기로 묶으면, 받침 깊은 단어 하나 때문에
  // 받침 없는 단어(루루 같은)까지 덩달아 커진다.
  const vb={};
  found.forEach(f=>{
    const k=Math.round(Math.log(Math.max(4,f.L.approxH))/Math.log(1.28))+'|'+f.sw;
    (vb[k]=vb[k]||[]).push(f);
  });
  Object.keys(vb).forEach(k=>{
    const g=vb[k];
    let H=0;g.forEach(f=>{if(f.ih>H)H=f.ih;});
    H+=Math.max(1,Math.round(H*0.03))*2;
    g.forEach(f=>{
      let y0=Math.round(f.cy-H/2),y1=y0+H;
      // 높이는 그대로 두고 위치만 밀어서, 반올림 때문에 획 끝이 남는 일이 없게
      if(y0>f.top){const d=y0-f.top;y0-=d;y1-=d;}
      if(y1<f.bot){const d=f.bot-y1;y0+=d;y1+=d;}
      f.y0=y0;f.y1=y1;
    });
  });
  found.sort((a,b)=>a.y0-b.y0||a.x0-b.x0);
  found.forEach(f=>{
    if(overlaps(f.x0,f.x1,f.y0,f.y1))return;
    drawCensor(ctx,srcCtx,canvas,f.x0,f.y0,f.x1-f.x0,f.y1-f.y0,f.lbl);
    drawn.push({x0:f.x0,x1:f.x1,y0:f.y0,y1:f.y1});
  });

  if(debugMode){
    // 단어마다 네모로 표시한다(원고지처럼). 모든 단어에 글자까지 겹쳐 쓰면 도배되므로,
    // 글자는 흐릿하게 읽은 것에만 붙인다 — 고칠 곳이 바로 눈에 띈다.
    ctx.save();
    ctx.lineWidth=Math.max(1,Math.round(medH*0.045));
    const fs=Math.max(10,Math.round(medH*0.4));
    // 줄 단위 범위 — 어디서부터 어디까지 한 줄로 읽었는지 보인다
    const src=(shot.ocr&&shot.ocr.kor)||null;
    if(src&&src.lines){
      ctx.setLineDash([Math.round(medH*0.22),Math.round(medH*0.16)]);
      ctx.strokeStyle='rgba(150,150,150,.55)';
      src.lines.forEach((l,n)=>{
        const b=l.bbox; if(!b)return;
        const pad=Math.round(medH*0.1);
        ctx.strokeRect(b.x0-pad,b.y0-pad,(b.x1-b.x0)+pad*2,(b.y1-b.y0)+pad*2);
        ctx.setLineDash([]);
        ctx.font='600 '+Math.round(fs*0.8)+'px sans-serif';
        ctx.fillStyle='rgba(120,120,120,.9)';
        ctx.fillText(String(n+1),Math.max(2,b.x0-pad-fs*0.8),b.y0+ (b.y1-b.y0)/2);
        ctx.setLineDash([Math.round(medH*0.22),Math.round(medH*0.16)]);
      });
      ctx.setLineDash([]);
    }
    allW.forEach(w=>{
      const b=w.bbox, conf=w.confidence!==undefined?w.confidence:100, weak=conf<72;
      ctx.strokeStyle=weak?'rgba(200,40,40,.95)':'rgba(60,120,220,.5)';
      ctx.strokeRect(b.x0,b.y0,b.x1-b.x0,b.y1-b.y0);
      if(weak){
        const t=(w.text||'').trim();
        if(t){
          ctx.font='600 '+fs+'px sans-serif';
          const tw=ctx.measureText(t).width;
          ctx.fillStyle='rgba(255,255,255,.92)';
          ctx.fillRect(b.x0-2,b.y0-fs-4,tw+4,fs+3);
          ctx.fillStyle='rgba(190,40,40,.95)';
          ctx.fillText(t,b.x0,b.y0-4);
        }
      }
    });
    ctx.restore();
  }

  shot.count=[...hitCount.values()].reduce((a,b)=>a+b,0);
  // 사진마다 어떤 단어를 몇 번 찾았는지 기록해 둔다.
  // "이 사진에 그 단어가 없었다"는 건 오류가 아니므로, 안내는 전체를 모아서 판단한다.
  shot.hits={};
  targets.forEach(t=>{if(!t.auto)shot.hits[t.sw]=hitCount.get(t.sw)||0;});
  shot.missed=[];
  paintThumb(shot);
}

/* ==========================================================================
   여러 장 관리
   ========================================================================== */
const MAX_SHOTS=12, MAX_SIDE=2000;

function switchTab(t){
  document.getElementById('tab-img').classList.toggle('active',t==='image');
  document.getElementById('tab-txt').classList.toggle('active',t==='text');
  document.getElementById('image-panel').style.display=t==='image'?'':'none';
  document.getElementById('text-panel').classList.toggle('show',t==='text');
  document.getElementById('dock').classList.toggle('show',t==='image'&&shots.length>0);
}

function addFiles(files){
  const arr=[...files].filter(f=>/^image\//.test(f.type));
  if(!arr.length){toast('사진 파일만 넣을 수 있어요');return;}
  const room=MAX_SHOTS-shots.length;
  if(room<=0){toast('한 번에 '+MAX_SHOTS+'장까지 할 수 있어요');return;}
  if(arr.length>room)toast(MAX_SHOTS+'장까지만 넣었어요');
  arr.slice(0,room).forEach(f=>{
    const shot={id:++seq,name:f.name,img:null,src:null,srcCtx:null,out:null,
                ocr:null,lines:null,count:0,hits:{},missed:[],status:'load',el:null,thumb:null};
    shots.push(shot);
    const rd=new FileReader();
    rd.onload=e=>{
      const img=new Image();
      img.onload=()=>{attachImage(shot,img);renderSheet();updateDock();};
      // 아이폰 기본 촬영 포맷(HEIC)은 브라우저가 못 읽는다 — 조용히 사라지면 이유를 알 수 없으니 알려준다
      img.onerror=()=>{
        shots=shots.filter(s=>s!==shot);renderSheet();updateDock();
        toast(/\.(heic|heif)$/i.test(f.name)||/heic|heif/i.test(f.type)
          ? 'HEIC 사진은 못 읽어요 — 아이폰 설정 › 카메라 › 포맷을 «높은 호환성»으로 바꾸거나, 스크린샷으로 넣어주세요'
          : f.name+' 은(는) 열 수 없는 사진이에요');
      };
      img.src=e.target.result;
    };
    rd.onerror=()=>{shots=shots.filter(s=>s!==shot);renderSheet();};
    rd.readAsDataURL(f);
  });
  renderSheet();updateDock();
}

function attachImage(shot,img){
  let w=img.width,h=img.height;
  if(Math.max(w,h)>MAX_SIDE){const s=MAX_SIDE/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}
  const src=document.createElement('canvas');src.width=w;src.height=h;
  const sctx=src.getContext('2d',{willReadFrequently:true});
  sctx.imageSmoothingEnabled=true;sctx.imageSmoothingQuality='high';
  sctx.drawImage(img,0,0,w,h);
  const out=document.createElement('canvas');out.width=w;out.height=h;
  out.getContext('2d').drawImage(src,0,0);
  shot.src=src;shot.srcCtx=sctx;shot.out=out;shot.img=src;shot.status='ready';
}

function removeShot(id,ev){
  if(ev)ev.stopPropagation();
  shots=shots.filter(s=>s.id!==id);
  renderSheet();updateDock();report();
}

function clearAll(){
  if(!shots.length)return;
  shots=[];renderSheet();updateDock();
  document.getElementById('report').classList.remove('show');
  document.getElementById('status').classList.remove('show');
}

function renderSheet(){
  const sheet=document.getElementById('sheet');
  const drop=document.getElementById('drop');
  if(!shots.length){sheet.style.display='none';drop.style.display='';return;}
  drop.style.display='none';sheet.style.display='grid';
  sheet.innerHTML='';
  shots.forEach((s,i)=>{
    if(!s.el){
      const cell=document.createElement('div');
      cell.className='cell';
      cell.innerHTML='<canvas></canvas><span class="num"></span>'+
        '<button class="x" title="빼기">✕</button><span class="state"></span>';
      cell.querySelector('.x').onclick=e=>removeShot(s.id,e);
      cell.onclick=()=>openDetail(s.id);
      s.el=cell;
      s.thumb=cell.querySelector('canvas');
      s.thumb.style.cssText='width:100%;height:100%;display:block;object-fit:cover';
    }
    s.el.querySelector('.num').textContent=String(i+1).padStart(2,'0');
    sheet.appendChild(s.el);
    paintThumb(s);paintCell(s);
  });
  const add=document.createElement('button');
  add.className='add-cell';
  add.innerHTML='<span class="plus">+</span>더 넣기';
  add.onclick=()=>document.getElementById('file-input').click();
  sheet.appendChild(add);
}

function paintThumb(shot){
  if(!shot.thumb||!shot.out)return;
  const t=shot.thumb;
  const W=180,H=240;
  if(t.width!==W){t.width=W;t.height=H;}
  const c=t.getContext('2d');
  c.fillStyle='#E7E3D6';c.fillRect(0,0,W,H);
  const s=Math.max(W/shot.out.width,H/shot.out.height);
  const dw=shot.out.width*s,dh=shot.out.height*s;
  c.drawImage(shot.out,(W-dw)/2,0,dw,dh); // 위쪽 정렬 — 글자는 보통 위에 있어요
}

function paintCell(shot){
  if(!shot.el)return;
  const st=shot.el.querySelector('.state');
  st.className='state';
  if(shot.status==='load'){st.textContent='불러오는 중';}
  else if(shot.status==='busy'){st.textContent='읽는 중';st.classList.add('busy');}
  else if(shot.status==='fail'){st.textContent='실패';}
  else if(shot.status==='done'){
    if(shot.count){st.textContent=shot.count+'곳 가림';st.classList.add('hit');shot.el.classList.add('done');}
    else{st.textContent='해당 단어 없음';shot.el.classList.remove('done');}
  }
  else{st.textContent='대기';shot.el.classList.remove('done');}
}

function updateDock(){
  const d=document.getElementById('dock');
  d.classList.toggle('show',shots.length>0&&document.getElementById('tab-img').classList.contains('active'));
  const total=shots.reduce((a,s)=>a+s.count,0);
  document.getElementById('dock-count').innerHTML=
    '<b>'+shots.length+'장</b>'+(total?total+'곳 가림':'아직 안 가림');
  document.getElementById('clear-btn').style.display=shots.length?'':'none';
  document.getElementById('save-all').disabled=!shots.length;
}

function setStatus(label,pct){
  document.getElementById('status-label').textContent=label;
  document.getElementById('status-pct').textContent=Math.round(pct)+'%';
  document.getElementById('bar-fill').style.width=Math.round(pct)+'%';
}

async function ocrShot(shot,needEng,onTick){
  const {canvas:pc,k}=preprocess(shot.src);
  onProg=m=>{if(m.progress!==undefined&&m.status==='recognizing text')onTick(m.progress*100);};
  try{
    if(!shot.ocr){
      // 한글 전용 모델로 읽는다. 한·영을 함께 올리면 후보가 늘어 한글 정확도가 떨어진다
      // (영문 단어를 가릴 때는 아래에서 eng 모델을 따로 한 번 더 돌린다)
      const w=await getWorker('kor');
      const r=await w.recognize(pc);
      unscaleOcr(r.data,k);
      shot.ocr={kor:r.data,eng:null};shot.lines=null;
    }
    if(needEng&&!shot.ocr.eng){
      const w=await getWorker('eng');
      const r=await w.recognize(pc);
      unscaleOcr(r.data,k);
      shot.ocr.eng=r.data;shot.lines=null;
    }
  }finally{onProg=null;}
}

async function runScan(){
  if(scanning)return;
  if(!shots.length){toast('사진을 먼저 골라주세요');return;}
  const targets=buildTargets();
  if(!targets.length){toast('가릴 단어를 쓰거나 자동 가리기를 켜주세요');return;}
  if(!tessReady){toast('글자 인식 엔진을 준비 중이에요');return;}
  const ready=shots.filter(s=>s.out);
  if(!ready.length){toast('사진을 불러오는 중이에요');return;}

  scanning=true;
  const btn=document.getElementById('scan-btn');
  btn.disabled=true;btn.textContent='가리는 중…';
  document.getElementById('status').classList.add('show');
  document.getElementById('report').classList.remove('show');
  const needEng=targets.some(t=>t.latin);

  for(let i=0;i<ready.length;i++){
    const s=ready[i];
    const head=(i+1)+' / '+ready.length+'장';
    setStatus(head+' 읽는 중',0);
    s.status='busy';paintCell(s);
    await new Promise(r=>requestAnimationFrame(r));
    try{
      await ocrShot(s,needEng,p=>setStatus(head+' 읽는 중',p));
      setStatus(head+' 덮는 중',100);
      censorShot(s);
      s.status='done';
    }catch(e){console.error(e);s.status='fail';}
    paintCell(s);
    await new Promise(r=>setTimeout(r,16));
  }
  setStatus('다 됐어요',100);
  scanning=false;btn.disabled=false;btn.textContent='전부 가리기';
  report();updateDock();
}

/* 단어·덮개 스타일만 바꾸면 다시 읽지 않고 덮개만 새로 그린다 */
let _reT=null;
function reapply(){
  clearTimeout(_reT);
  _reT=setTimeout(()=>{
    let any=false;
    shots.forEach(s=>{if(s.ocr){censorShot(s);s.status='done';paintCell(s);any=true;}});
    if(any){report();updateDock();refreshDetail();}
  },160);
}

function report(){
  const box=document.getElementById('report');
  const done=shots.filter(s=>s.status==='done');
  if(!done.length){box.classList.remove('show');return;}
  const total=done.reduce((a,s)=>a+s.count,0);
  // 단어별로 '전체 사진을 통틀어' 한 번도 못 찾은 것만 알려 준다.
  // 어떤 사진에 그 단어가 안 나오는 건 정상이라 오류로 볼 수 없다.
  const sum={};
  done.forEach(s=>{
    Object.keys(s.hits||{}).forEach(w=>{sum[w]=(sum[w]||0)+s.hits[w];});
  });
  const words=Object.keys(sum);
  const never=words.filter(w=>sum[w]===0);
  let h;
  if(total){
    h='<b>'+total+'곳</b> 가렸어요 · 사진 '+done.length+'장';
    const per=words.filter(w=>sum[w]>0).map(w=>'"'+w+'" '+sum[w]+'곳');
    if(per.length>1)h+='<span class="miss">'+per.join(' · ')+'</span>';
  }else{
    h='한 곳도 못 찾았어요';
  }
  if(never.length)h+='<span class="miss">"'+never.join('", "')+
    '" 은(는) 어느 사진에서도 못 찾았어요. 글씨가 흐리거나 철자가 다를 수 있어요 — 사진을 눌러 손으로 칠해 보세요.</span>';
  box.innerHTML=h;box.classList.add('show');
}

function activeShot(){return shots.find(s=>s.id===activeId)||null;}

let _detailBound=false;
function openDetail(id){
  const s=shots.find(x=>x.id===id);
  if(!s||!s.out)return;
  activeId=id;
  const idx=shots.indexOf(s);
  document.getElementById('detail-title').textContent=
    String(idx+1).padStart(2,'0')+(shots.length>1?' / '+String(shots.length).padStart(2,'0'):'');

// 옆으로 밀어서 다음·이전 사진
function goDetail(dir){
  const s=activeShot();
  if(!s)return;
  const i=shots.indexOf(s)+dir;
  if(i<0||i>=shots.length){toast(dir>0?'마지막 사진이에요':'첫 사진이에요');return;}
  openDetail(shots[i].id);
}
function _bindDetailSwipe(){
  const stage=document.getElementById('detail-stage');
  let st=null;
  stage.addEventListener('touchstart',e=>{
    if(e.touches.length!==1){st=null;return;}
    const t=e.touches[0];
    st={x:t.clientX,y:t.clientY,top:stage.scrollTop};
  },{passive:true});
  stage.addEventListener('touchend',e=>{
    if(!st||!e.changedTouches.length)return;
    const t=e.changedTouches[0];
    const dx=t.clientX-st.x,dy=t.clientY-st.y;
    const scrolled=Math.abs(stage.scrollTop-st.top)>4;
    st=null;
    if(!scrolled&&Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.5)goDetail(dx<0?1:-1);
  },{passive:true});
  document.addEventListener('keydown',e=>{
    if(!document.getElementById('detail-modal').classList.contains('show'))return;
    if(e.key==='ArrowLeft')goDetail(-1);
    else if(e.key==='ArrowRight')goDetail(1);
    else if(e.key==='Escape')closeDetail();
  });
}
function refreshDetail(){
  const s=activeShot();
  if(!s)return;
  document.getElementById('detail-sub').textContent=
    s.status==='done'?(s.count?s.count+'곳 가림':'이 사진엔 해당 단어가 없어요'):'아직 안 읽었어요';
  if(document.getElementById('readout').classList.contains('show'))paintReadout();
}

/* 읽은 글자를 그대로 보여준다 — 사진 위에 겹쳐 쓰는 것보다 확인하기 쉽다 */
function toggleRead(){
  const box=document.getElementById('readout');
  box.classList.toggle('show');
  if(box.classList.contains('show'))paintReadout();
}
function paintReadout(){
  const box=document.getElementById('readout'), s=activeShot();
  if(!s)return;
  if(!s.ocr){ box.innerHTML='<div class="ro-empty">아직 안 읽었어요 — «전부 가리기»를 먼저 눌러 주세요</div>'; return }

  const render=data=>{
    const lines=[]; let weak=0;
    (data.lines||[]).forEach(l=>{
      const ws=(l.words||[]).filter(w=>(w.text||'').trim());
      if(ws.length) lines.push(ws);
    });
    if(!lines.length) return {html:'<div class="ro-empty">글자를 찾지 못했어요</div>',n:0,weak:0};
    const html=lines.map(ws=>'<div class="ro-line">'+ws.map(w=>{
      const c=w.confidence!==undefined?w.confidence:100, t=w.text.trim();
      if(c<72) weak++;
      return '<span class="ro-w'+(c<72?' weak':'')+'" title="확신도 '+Math.round(c)+'%">'+
        t.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))+'</span>';
    }).join(' ')+'</div>').join('');
    return {html,n:lines.length,weak};
  };

  const k=render(s.ocr.kor||{});
  let out=k.html
    +'<div class="ro-foot">한글 모델 · '+k.n+'줄'
    +(k.weak?' · <b>'+k.weak+'개</b>는 흐릿해요 (빨간 글자)':' · 전부 또렷해요')+'</div>';
  // 영문 단어를 가릴 때만 영문 모델이 돌아간다 — 그 결과도 따로 보여준다
  if(s.ocr.eng){
    const e=render(s.ocr.eng);
    out+='<div class="ro-sep"></div>'+e.html
      +'<div class="ro-foot">영문 모델 · '+e.n+'줄'+(e.weak?' · '+e.weak+'개 흐릿':'')+'</div>';
  }
  box.innerHTML=out;
}

async function toBlob(canvas){return new Promise(r=>canvas.toBlob(r,'image/png'));}
// 안드로이드(갤럭시)는 공유 시트로 넘기면 저장이 잘 안 돼서 바로 내려받게 한다
function isAndroid(){return /Android/i.test(navigator.userAgent);}

async function saveOne(){
  const s=activeShot();
  if(!s)return;
  const blob=await toBlob(s.out);
  const idx=String(shots.indexOf(s)+1).padStart(2,'0');
  const file=new File([blob],'가림_'+idx+'.png',{type:'image/png'});
  try{
    if(!isAndroid()&&navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:'가림'});return;
    }
  }catch(e){if(e.name==='AbortError')return;}
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.download=file.name;a.href=url;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),8000);
  toast('저장했어요');
}

async function saveAll(){
  const list=shots.filter(s=>s.out);
  if(!list.length){toast('저장할 사진이 없어요');return;}
  const btn=document.getElementById('save-all');
  btn.disabled=true;btn.textContent='저장 중…';
  try{
    const files=[];
    for(let i=0;i<list.length;i++){
      const b=await toBlob(list[i].out);
      files.push(new File([b],'가림_'+String(i+1).padStart(2,'0')+'.png',{type:'image/png'}));
    }
    try{
      if(!isAndroid()&&navigator.canShare&&navigator.canShare({files})){
        await navigator.share({files,title:'가림'});return;
      }
    }catch(e){if(e.name==='AbortError')return;}
    for(const f of files){
      const url=URL.createObjectURL(f);
      const a=document.createElement('a');a.download=f.name;a.href=url;a.click();
      setTimeout(()=>URL.revokeObjectURL(url),10000);
      await new Promise(r=>setTimeout(r,400));
    }
    toast(files.length+'장 저장했어요');
  }finally{btn.disabled=false;btn.textContent='전부 저장';}
}

/* ==========================================================================
   손으로 칠하기
   ========================================================================== */
let _dz={s:1,tx:0,ty:0},_mosaicPat=null,_drawUndo=[],_paintLast=null,_pinch0=null,_drawBound=false;

function openDraw(){
  const s=activeShot();
  if(!s)return;
  const dc=document.getElementById('draw-canvas');
  dc.width=s.out.width;dc.height=s.out.height;
  dc.getContext('2d').drawImage(s.out,0,0);
  _buildMosaicPattern(dc);
  _drawUndo=[];_dz={s:1,tx:0,ty:0};_applyDz();
  document.getElementById('draw-modal').classList.add('show');
  if(!_drawBound){_bindDraw();_drawBound=true;}
}
function closeDraw(){document.getElementById('draw-modal').classList.remove('show');}

function _buildMosaicPattern(dc){
  const block=Math.max(8,Math.round(Math.max(dc.width,dc.height)/90));
  const small=document.createElement('canvas');
  small.width=Math.max(1,Math.round(dc.width/block));
  small.height=Math.max(1,Math.round(dc.height/block));
  small.getContext('2d').drawImage(dc,0,0,small.width,small.height);
  const big=document.createElement('canvas');
  big.width=dc.width;big.height=dc.height;
  const bctx=big.getContext('2d');
  bctx.imageSmoothingEnabled=false;
  bctx.drawImage(small,0,0,big.width,big.height);
  _mosaicPat=dc.getContext('2d').createPattern(big,'no-repeat');
}
function _applyDz(){
  document.getElementById('draw-pan').style.transform=
    'translate('+_dz.tx+'px,'+_dz.ty+'px) scale('+_dz.s+')';
}
function _brushPx(){
  const dc=document.getElementById('draw-canvas');
  return Math.max(10,Math.round(dc.width*0.011*(+document.getElementById('brush-size').value)));
}
function _canvasPt(t){
  const dc=document.getElementById('draw-canvas');
  const r=dc.getBoundingClientRect();
  return{x:(t.clientX-r.left)/r.width*dc.width,y:(t.clientY-r.top)/r.height*dc.height};
}
function _pushUndo(){
  const dc=document.getElementById('draw-canvas');
  const snap=document.createElement('canvas');
  snap.width=dc.width;snap.height=dc.height;
  snap.getContext('2d').drawImage(dc,0,0);
  _drawUndo.push(snap);
  if(_drawUndo.length>6)_drawUndo.shift();
}
function undoDraw(){
  if(!_drawUndo.length){toast('되돌릴 게 없어요');return;}
  const dc=document.getElementById('draw-canvas');
  const snap=_drawUndo.pop(),c=dc.getContext('2d');
  c.clearRect(0,0,dc.width,dc.height);c.drawImage(snap,0,0);
}
function _paintSeg(p0,p1){
  const dc=document.getElementById('draw-canvas'),c=dc.getContext('2d');
  c.save();
  c.strokeStyle=_mosaicPat;c.lineWidth=_brushPx()*2;
  c.lineCap='round';c.lineJoin='round';
  c.beginPath();c.moveTo(p0.x,p0.y);c.lineTo(p1.x+0.01,p1.y+0.01);c.stroke();
  c.restore();
}
function _bindDraw(){
  const wrap=document.getElementById('draw-wrap');
  wrap.addEventListener('touchstart',e=>{
    e.preventDefault();
    if(e.touches.length===1){
      _pinch0=null;_pushUndo();
      _paintLast=_canvasPt(e.touches[0]);_paintSeg(_paintLast,_paintLast);
    }else if(e.touches.length===2){
      if(_paintLast&&_drawUndo.length)undoDraw();
      _paintLast=null;
      const a=e.touches[0],b=e.touches[1];
      _pinch0={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),
               mx:(a.clientX+b.clientX)/2,my:(a.clientY+b.clientY)/2,
               s:_dz.s,tx:_dz.tx,ty:_dz.ty};
    }
  },{passive:false});
  wrap.addEventListener('touchmove',e=>{
    e.preventDefault();
    if(e.touches.length===1&&_paintLast){
      const p=_canvasPt(e.touches[0]);_paintSeg(_paintLast,p);_paintLast=p;
    }else if(e.touches.length===2&&_pinch0){
      const a=e.touches[0],b=e.touches[1];
      const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
      const mx=(a.clientX+b.clientX)/2,my=(a.clientY+b.clientY)/2;
      const ns=Math.min(8,Math.max(1,_pinch0.s*d/_pinch0.d));
      const wr=wrap.getBoundingClientRect();
      const ox=_pinch0.mx-wr.left,oy=_pinch0.my-wr.top;
      _dz.s=ns;
      _dz.tx=(mx-wr.left)-(ox-_pinch0.tx)*(ns/_pinch0.s);
      _dz.ty=(my-wr.top)-(oy-_pinch0.ty)*(ns/_pinch0.s);
      _applyDz();
    }
  },{passive:false});
  wrap.addEventListener('touchend',e=>{if(e.touches.length===0){_paintLast=null;_pinch0=null;}});
  wrap.addEventListener('mousedown',e=>{
    e.preventDefault();_pushUndo();
    _paintLast=_canvasPt(e);_paintSeg(_paintLast,_paintLast);
  });
  window.addEventListener('mousemove',e=>{
    if(!_paintLast||!document.getElementById('draw-modal').classList.contains('show'))return;
    const p=_canvasPt(e);_paintSeg(_paintLast,p);_paintLast=p;
  });
  window.addEventListener('mouseup',()=>{_paintLast=null;});
  wrap.addEventListener('wheel',e=>{
    e.preventDefault();
    const wr=wrap.getBoundingClientRect();
    const ns=Math.min(8,Math.max(1,_dz.s*(e.deltaY<0?1.15:0.87)));
    const ox=e.clientX-wr.left,oy=e.clientY-wr.top;
    _dz.tx=ox-(ox-_dz.tx)*(ns/_dz.s);
    _dz.ty=oy-(oy-_dz.ty)*(ns/_dz.s);
    _dz.s=ns;_applyDz();
  },{passive:false});
}
function applyDraw(){
  const s=activeShot();
  if(!s)return;
  const dc=document.getElementById('draw-canvas');
  // 칠한 결과를 원본으로 굳혀 두면 덮개를 다시 그려도 지워지지 않아요
  s.srcCtx.drawImage(dc,0,0);
  s.out.getContext('2d').drawImage(dc,0,0);
  s.lines=null; // 그림이 바뀌었으니 줄 분석은 다시
  paintThumb(s);closeDraw();toast('칠했어요');
}

/* ==========================================================================
   자르기
   ========================================================================== */
let _cr={x:0,y:0,w:0,h:0},_dt=null,_ds=null,_rs=null,_cropBound=false;

function openCrop(){
  const s=activeShot();
  if(!s)return;
  const ci=document.getElementById('crop-img');
  const init=()=>{
    const r=ci.getBoundingClientRect(),wr=document.getElementById('crop-wrap').getBoundingClientRect();
    _cr={x:r.left-wr.left,y:r.top-wr.top,w:r.width,h:r.height};
    _renderSel();
    if(!_cropBound){_bindCrop();_cropBound=true;}
  };
  ci.onload=()=>requestAnimationFrame(init);
  ci.src=s.out.toDataURL();
  document.getElementById('crop-modal').classList.add('show');
  if(ci.complete&&ci.naturalWidth)requestAnimationFrame(init);
}
function closeCrop(){document.getElementById('crop-modal').classList.remove('show');}
function _renderSel(){
  const s=document.getElementById('crop-sel');
  s.style.left=_cr.x+'px';s.style.top=_cr.y+'px';
  s.style.width=_cr.w+'px';s.style.height=_cr.h+'px';
}
function _bindCrop(){
  const wrap=document.getElementById('crop-wrap');
  const ci=document.getElementById('crop-img');
  function gp(e){
    const r=wrap.getBoundingClientRect();
    const t=e.touches?e.touches[0]:e;
    return{x:t.clientX-r.left,y:t.clientY-r.top};
  }
  function dn(e){
    const c=e.target.dataset&&e.target.dataset.c;
    const onSel=e.target.closest&&e.target.closest('#crop-sel');
    if(!c&&!onSel)return;
    _ds=gp(e);_rs=Object.assign({},_cr);_dt=c?'h-'+c:'move';
    e.preventDefault();
  }
  function mv(e){
    if(!_dt)return;
    const p=gp(e),dx=p.x-_ds.x,dy=p.y-_ds.y;
    const ir=ci.getBoundingClientRect(),wr=wrap.getBoundingClientRect();
    const L=ir.left-wr.left,T=ir.top-wr.top,W=ir.width,H=ir.height,MIN=24;
    let x=_rs.x,y=_rs.y,w=_rs.w,h=_rs.h;
    if(_dt==='move'){
      x=Math.max(L,Math.min(L+W-w,x+dx));
      y=Math.max(T,Math.min(T+H-h,y+dy));
    }else{
      const c=_dt.slice(2);
      if(c==='tl'){x=Math.min(x+w-MIN,x+dx);y=Math.min(y+h-MIN,y+dy);w=_rs.x+_rs.w-x;h=_rs.y+_rs.h-y;}
      else if(c==='tr'){w=Math.max(MIN,w+dx);y=Math.min(y+h-MIN,y+dy);h=_rs.y+_rs.h-y;}
      else if(c==='bl'){x=Math.min(x+w-MIN,x+dx);w=_rs.x+_rs.w-x;h=Math.max(MIN,h+dy);}
      else{w=Math.max(MIN,w+dx);h=Math.max(MIN,h+dy);}
      x=Math.max(L,x);y=Math.max(T,y);
      w=Math.min(L+W-x,w);h=Math.min(T+H-y,h);
    }
    _cr={x,y,w,h};_renderSel();e.preventDefault();
  }
  function up(){_dt=null;}
  wrap.addEventListener('mousedown',dn);
  wrap.addEventListener('touchstart',dn,{passive:false});
  window.addEventListener('mousemove',mv);
  window.addEventListener('touchmove',mv,{passive:false});
  window.addEventListener('mouseup',up);
  window.addEventListener('touchend',up);
}
function applyCrop(){
  const s=activeShot();
  if(!s)return;
  const ci=document.getElementById('crop-img');
  const wrap=document.getElementById('crop-wrap');
  const ir=ci.getBoundingClientRect(),wr=wrap.getBoundingClientRect();
  const L=ir.left-wr.left,T=ir.top-wr.top;
  const kx=s.out.width/ir.width,ky=s.out.height/ir.height;
  const rx=Math.max(0,Math.round((_cr.x-L)*kx)),ry=Math.max(0,Math.round((_cr.y-T)*ky));
  const rw=Math.max(1,Math.min(Math.round(_cr.w*kx),s.out.width-rx));
  const rh=Math.max(1,Math.min(Math.round(_cr.h*ky),s.out.height-ry));
  const nsrc=document.createElement('canvas');nsrc.width=rw;nsrc.height=rh;
  nsrc.getContext('2d',{willReadFrequently:true}).drawImage(s.src,rx,ry,rw,rh,0,0,rw,rh);
  const nout=document.createElement('canvas');nout.width=rw;nout.height=rh;
  nout.getContext('2d').drawImage(nsrc,0,0);
  s.src=nsrc;s.srcCtx=nsrc.getContext('2d',{willReadFrequently:true});
  s.img=nsrc;s.out=nout;s.ocr=null;s.lines=null;s.count=0;s.hits={};s.missed=[];s.status='ready';
  paintThumb(s);paintCell(s);
  const stage=document.getElementById('detail-stage');
  stage.innerHTML='';stage.appendChild(nout);
  closeCrop();refreshDetail();updateDock();
  toast('잘랐어요 — 다시 인식을 눌러 주세요');
}

let rules=[{from:'',to:''}];
function renderRules(){
  const list=document.getElementById('rules-list');
  list.innerHTML='';
  rules.forEach((r,i)=>{
    const row=document.createElement('div');
    row.className='rule-row';
    row.innerHTML='<input class="field" style="flex:1;min-width:0" placeholder="찾을 단어" value="'+r.from.replace(/"/g,'&quot;')+'"/>'+
      '<span class="arrow">→</span>'+
      '<input class="field" style="flex:1;min-width:0" placeholder="바꿀 단어" value="'+r.to.replace(/"/g,'&quot;')+'"/>'+
      (rules.length>1?'<button class="del-rule">✕</button>':'<span style="width:18px"></span>');
    const ins=row.querySelectorAll('input');
    ins[0].oninput=e=>{rules[i].from=e.target.value;};
    ins[1].oninput=e=>{rules[i].to=e.target.value;};
    const del=row.querySelector('.del-rule');
    if(del)del.onclick=()=>{rules.splice(i,1);renderRules();};
    list.appendChild(row);
  });
}
function addRule(){
  rules.push({from:'',to:''});renderRules();
  const ins=document.querySelectorAll('#rules-list .rule-row:last-child input');
  if(ins[0])ins[0].focus();
}
function doReplace(){
  const src=document.getElementById('src-text').value;
  if(!src)return '';
  let result=src;
  rules.forEach(r=>{if(r.from)result=result.split(r.from).join(r.to);});
  return result;
}
renderRules();

let _resultRaw='';
function isDarkBg(hex){
  const m=/^#?([0-9a-f]{6})$/i.exec(hex||'');
  if(!m)return false;
  const n=parseInt(m[1],16);
  return (0.299*((n>>16)&255)+0.587*((n>>8)&255)+0.114*(n&255))<110;
}
function renderMarkup(text,dark){
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const protectEllipsis=s=>s.replace(/[…⋯]+/g,m=>'<span style="letter-spacing:0">'+'.'.repeat(m.length*3)+'</span>');
  const grayCol=dark?'#b8b2aa':'#6b6560';
  const codeBg=dark?'#3a3630':'#14121A';
  const codeHdr=dark?'#2e2a26':'#2a2520';
  const codes=[];
  let t=text.replace(/\n?```([\s\S]*?)```\n?/g,(m,c)=>{codes.push({block:true,c});return '\u0000C'+(codes.length-1)+'\u0000';})
            .replace(/`([^`\n]+?)`/g,(m,c)=>{codes.push({block:false,c});return '\u0000C'+(codes.length-1)+'\u0000';});
  t=esc(t);t=protectEllipsis(t);
  t=t.replace(/\*\*([^*]+?)\*\*/g,'<b>$1</b>');
  const quoteCol=dark?'#4a4540':'#ccc8c2',quoteFg=dark?'#c8c2bc':'#6b6560';
  t=t.replace(/(^|\n)&gt;\s?([^\n]*)/g,(m,pre,body)=>
    '<span style="display:block;border-left:3px solid '+quoteCol+';padding:2px 0 2px 10px;margin:1px 0;color:'+quoteFg+'">'+body+'</span>');
  t=t.replace(/\*([^*\n]+?)\*/g,'<span style="color:'+grayCol+'">$1</span>');
  t=t.replace(/\u0000C(\d+)\u0000/g,(m,i)=>{
    const it=codes[+i],inner=esc(it.block?it.c.trim():it.c);
    if(it.block){
      return '<div style="background:'+codeBg+';margin:6px 0;overflow:hidden">'
        +'<div style="padding:7px 12px 6px;border-bottom:1px solid '+codeHdr+'">'
        +'<span style="font-size:10px;font-weight:600;letter-spacing:1px;color:#7a736d">INFO</span></div>'
        +'<code style="display:block;color:#f0ece6;padding:10px 14px;font-family:inherit;font-size:14px;line-height:1.75;white-space:pre-wrap;word-break:break-all">'+inner+'</code></div>';
    }
    return '<code style="background:'+codeBg+';color:#f0ece6;padding:1px 5px;font-family:inherit;font-size:13px">'+inner+'</code>';
  });
  return t;
}

let selectedBg=BG_COLORS[0].color,selectedEmojis=null;
function tcode(e){return [...e].map(c=>c.codePointAt(0).toString(16)).filter(c=>c!=='fe0f').join('-');}
function decoHTML(emojis){
  if(!emojis||!emojis.length)return '';
  const P=[[10,15,22,-12],[15,85,20,15],[28,50,18,5],[45,18,24,-8],[50,82,16,12],[65,45,20,-10],[85,20,18,-5],[82,80,22,8]];
  let h='<div style="position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0">';
  P.forEach((p,i)=>{
    const url='https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/72x72/'+tcode(emojis[i%emojis.length])+'.png';
    h+='<img crossorigin="anonymous" src="'+url+'" style="position:absolute;top:'+p[0]+'%;left:'+p[1]+'%;width:'+p[2]+'px;height:'+p[2]+'px;opacity:.25;transform:translate(-50%,-50%) rotate('+p[3]+'deg)"/>';
  });
  return h+'</div>';
}
const bgOpts=document.getElementById('bg-opts');
BG_COLORS.forEach((b,i)=>{
  const d=document.createElement('div');
  d.className='bg-opt'+(i===0?' on':'');
  d.style.background=b.color;d.title=b.name;
  if(b.emojis){
    d.innerHTML='<img crossorigin="anonymous" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/72x72/'+tcode(b.emojis[0])+'.png" style="width:14px;height:14px"/>';
    d.style.display='flex';d.style.alignItems='center';d.style.justifyContent='center';

  bgOpts.appendChild(d);
});

function _renderPreview(){
  const rt=document.getElementById('result-text');
  const dark=isDarkBg(selectedBg);
  rt.style.background=selectedBg;
  rt.style.color=dark?'#f0ece6':'#14121A';
  const body=renderMarkup(_resultRaw,dark),deco=decoHTML(selectedEmojis);
  rt.innerHTML=deco?'<div style="position:relative">'+deco+'<div style="position:relative;z-index:1">'+body+'</div></div>':body;
}
function openResult(){
  const result=doReplace();
  if(!result){toast('텍스트를 먼저 넣어 주세요');return;}
  _resultRaw=result;_renderPreview();
  document.getElementById('result-modal').classList.add('show');
}
function copyResult(){
  if(!_resultRaw){toast('복사할 내용이 없어요');return;}
  const fallback=()=>{
    try{
      const ta=document.createElement('textarea');
      ta.value=_resultRaw;ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.focus();ta.select();
      document.execCommand('copy');ta.remove();toast('복사했어요');
    }catch(e){toast('복사가 안 돼요 — 길게 눌러 직접 복사해 주세요');}
  };
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText)
      navigator.clipboard.writeText(_resultRaw).then(()=>toast('복사했어요')).catch(fallback);
    else fallback();
  }catch(e){fallback();}
}
async function textToImage(){
  if(!_resultRaw){toast('텍스트를 먼저 넣어 주세요');return;}
  if(typeof html2canvas==='undefined'){toast('이미지 변환 모듈을 아직 못 불러왔어요');return;}
  const dark=isDarkBg(selectedBg);
  const stageW=Math.min(window.innerWidth,430);
  const stage=document.createElement('div');
  stage.style.cssText='position:fixed;left:-99999px;top:0;width:'+stageW+'px;box-sizing:border-box;'+
    'padding:24px 20px;background:'+selectedBg+';color:'+(dark?'#f0ece6':'#14121A')+';'+
    "font-family:'Pretendard Variable',Pretendard,'Apple SD Gothic Neo',sans-serif;"+
    'font-size:14px;line-height:1.55;letter-spacing:-0.02em;white-space:pre-wrap;word-break:break-all;overflow-wrap:anywhere';
  const body=renderMarkup(_resultRaw,dark),deco=decoHTML(selectedEmojis);
  stage.innerHTML=deco?'<div style="position:relative">'+deco+'<div style="position:relative;z-index:1">'+body+'</div></div>':body;
  document.body.appendChild(stage);
  try{
    await document.fonts.ready;
    const imgs=[...stage.querySelectorAll('img')];
    if(imgs.length)await Promise.all(imgs.map(im=>im.complete?Promise.resolve():new Promise(r=>{im.onload=r;im.onerror=r;setTimeout(r,3000);})));
    const canvas=await html2canvas(stage,{
      backgroundColor:/gradient/i.test(selectedBg)?null:selectedBg,
      scale:Math.min(3,(window.devicePixelRatio||1)*1.5),useCORS:true,logging:false
    });
    stage.remove();
    const blob=await toBlob(canvas);
    const file=new File([blob],'가림_텍스트.png',{type:'image/png'});
    try{
      if(!isAndroid()&&navigator.canShare&&navigator.canShare({files:[file]})){
        await navigator.share({files:[file],title:'가림'});return;
      }
    }catch(e){if(e.name==='AbortError')return;}
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.download=file.name;a.href=url;a.click();
    setTimeout(()=>URL.revokeObjectURL(url),8000);
    toast('저장했어요');
  }catch(e){
    if(stage.parentNode)stage.remove();
    toast('이미지 저장 실패');console.error(e);
  }
}
